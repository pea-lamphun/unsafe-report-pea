  // SHA-256 hash helper
  async function hashPassword(pw) {
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  // ตรวจรหัสหัวหน้าหน่วยงาน — เทียบกับ hash ใน Firebase
  async function verifyUnitPassword(input) {
    const snap = await database.ref('config/unitPasswordHash').get();
    if (!snap.exists()) return false;
    const stored = snap.val();
    const inputHash = await hashPassword(input);
    return inputHash === stored;
  }

  // ================== IMAGE COMPRESSION & UPLOAD ==================
  async function compressImage(file, maxWidth = 1200, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          
          // ปรับขนาดถ้าใหญ่เกิน maxWidth
          if (width > maxWidth) {
            height = (height * maxWidth) / width;
            width = maxWidth;
          }
          
          canvas.width = width;
          canvas.height = height;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          // แปลงเป็น Base64 พร้อมบีบอัด
          canvas.toBlob((blob) => {
            const compressedReader = new FileReader();
            compressedReader.onload = (ev) => {
              resolve(ev.target.result);
            };
            compressedReader.readAsDataURL(blob);
          }, 'image/jpeg', quality);
        };
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  
  async function uploadToImgBB(base64Image) {
    try {
      // ลบ "data:image/jpeg;base64," ออก
      const base64Data = base64Image.split(',')[1];
      
      const formData = new FormData();
      formData.append('image', base64Data);
      
      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: 'POST',
        body: formData
      });
      
      const data = await response.json();
      
      if (data.success) {
        return data.data.url; // URL รูปภาพ
      } else {
        throw new Error('Upload failed');
      }
    } catch (error) {
      console.error('ImgBB upload error:', error);
      return null;
    }
  }

  // Setup Real-time Listeners (Sync ข้ามเครื่อง)
  function setupRealtimeListeners() {
    if (!isFirebaseReady) {

      return;
    }
    
    console.log('🔄 Setting up real-time sync...');
    
    // Listen for reports changes
    database.ref('reports').on('value', (snapshot) => {
      const reportsData = snapshot.val();
      if (reportsData) {
        state.reports = Object.values(reportsData)
          .sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));
        console.log('🔄 Reports synced from Firebase');
        render();
      }
    });
    
    // Listen for LINE users changes
    database.ref('lineUsers').on('value', (snapshot) => {
      const lineUsersData = snapshot.val();
      if (lineUsersData) {
        state.lineUsers = lineUsersData;
        console.log('🔄 LINE users synced from Firebase');
        // LINE users update ไม่ต้อง render() เพราะไม่มี UI
      }
    });
    
    console.log('✅ Real-time sync enabled!');
  }

  async function saveReport(report) {
    if (!isFirebaseReady) {
      alert('⚠️ Firebase ยังไม่พร้อม กรุณารอสักครู่');
      return;
    }
    
    try {
      const now = new Date();
      const yy = String(now.getFullYear() + 543).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const datePrefix = yy + mm + dd;
      
      const todayReports = state.reports.filter(r => r.reportNumber?.startsWith(datePrefix));
      const runningNumber = String(todayReports.length + 1).padStart(3, '0');
      
      const reportWithNumber = {
        ...report,
        reportNumber: datePrefix + runningNumber,
        createdAt: new Date().toISOString()
      };
      
      // Save to Firebase
      await database.ref('reports/' + report.id).set(reportWithNumber);
      console.log('✅ Report saved to Firebase:', reportWithNumber.reportNumber);
      
      // แจ้งเตือน Admin ว่ามีรายงานใหม่
      notifyAdminNewReport(reportWithNumber).then(success => {
        console.log('📤 Admin notification:', success ? 'sent' : 'no admin registered');
      });
      
      alert('✅ บันทึกรายงานสำเร็จ\n\nเลขที่รายงาน: ' + reportWithNumber.reportNumber);
      state.page = 'home';
      // ไม่ต้อง render() เพราะ real-time listener จะทำให้
    } catch(e) {
      console.error('❌ Save error:', e);
      alert('❌ เกิดข้อผิดพลาด: ' + e.message);
    }
  }
  
  async function updateReport(reportId, updates) {
    if (!isFirebaseReady) {
      console.warn('⚠️ Firebase ยังไม่พร้อม');
      return;
    }
    
    try {
      const report = state.reports.find(r => r.id === reportId);
      if (report) {
        const updatedReport = { ...report, ...updates };
        await database.ref('reports/' + reportId).set(updatedReport);
        console.log('✅ Report updated in Firebase:', reportId);
        // Real-time listener จะ update state อัตโนมัติ
      }
    } catch(e) {
      alert('❌ เกิดข้อผิดพลาด: ' + e.message);
    }
  }

  function navigateTo(page) {

  function showPasswordModal() {
    document.getElementById('passwordModal').classList.add('active');

    document.getElementById('passwordModal').classList.remove('active');
  }
  
  async function checkPassword() {
    // เข้าสู่ระบบด้วย Google
    try {
      const result = await auth.signInWithPopup(googleProvider);
      const email = result.user.email || '';
      // ตรวจ whitelist จาก Firebase
      const snap = await database.ref('config/adminEmails').get();
      const allowed = snap.exists() ? (snap.val() || []) : [];
      if (allowed.includes(email)) {
        state.isAdmin = true;
        state.adminUser = result.user;
        state.page = 'admin';
        closePasswordModal();
        render();
      } else {
        await auth.signOut();
        alert('❌ "' + email + '" ไม่มีสิทธิ์เข้าถึงระบบแอดมิน');
      }
    } catch(e) {
      if (e.code !== 'auth/popup-closed-by-user') {
        alert('เกิดข้อผิดพลาด: ' + e.message);
      }
    }
  }
  
  async function logout() {
    if (confirm('ต้องการออกจากระบบ Admin?')) {
      await auth.signOut().catch(()=>{});
      state.isAdmin = false;
      state.adminUser = null;
      state.page = 'home';
      render();
    }
  }
  
  function updateDepartments() {

    const reporterFirstName = document.getElementById('reporterFirstName')?.value || '';

    if (reporterFirstName) {
      document.getElementById('reporterFirstName').value = reporterFirstName;

    if (reporterLastName) {
      document.getElementById('reporterLastName').value = reporterLastName;
    }
    if (org) {
      document.getElementById('reporterOrg').value = org;
    }
  }
  
  let uploadedImages = [];
  
  async function handleImages(event) {
    const files = Array.from(event.target.files).slice(0, 3);
    uploadedImages = [];
    const preview = document.getElementById('imagePreview');
    preview.innerHTML = '<div class="col-span-3 text-center text-gray-600">⏳ กำลังบีบอัดและอัปโหลดรูป...</div>';
    
    if (files.length === 0) {
      preview.innerHTML = '';
      return;
    }
    
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      
      try {
        // บีบอัดรูป
        const compressed = await compressImage(file, 1200, 0.8);
        
        // แสดงตัวอย่างชั่วคราว
        preview.innerHTML = `<div class="col-span-3 text-center text-blue-600">📤 กำลังอัปโหลดรูปที่ ${i + 1}/${files.length}...</div>`;
        
        // อัปโหลดไป ImgBB
        const imageUrl = await uploadToImgBB(compressed);
        
        if (imageUrl) {
          uploadedImages.push(imageUrl);
        }
      } catch (error) {
        console.error('Image processing error:', error);
      }
    }
    
    // แสดงตัวอย่างรูปที่อัปโหลดสำเร็จ
    preview.innerHTML = '';
    uploadedImages.forEach((url, index) => {
      const div = document.createElement('div');
      div.className = 'relative';
      div.innerHTML = `
        <img src="${url}" class="w-full h-24 object-cover rounded-lg border-2 border-gray-300">
        <div class="absolute top-1 right-1 bg-green-600 text-white rounded-full px-2 py-1 text-xs font-semibold">
          ✓ ${index + 1}
        </div>
      `;
      preview.appendChild(div);
    });
    
    if (uploadedImages.length > 0) {
      const successDiv = document.createElement('div');

  async function assignWork(reportId) {
    const unitId = document.getElementById('unit-' + reportId).value;
    if (!unitId) {
      alert('❌ กรุณาเลือกหน่วยงาน');
      return;
    }
    
    // ดึงข้อมูลที่แก้ไขจากฟอร์ม
    const description = document.getElementById('description-' + reportId).value.trim();
    const workerName = document.getElementById('worker-name-' + reportId).value.trim();
    const workerUnit = document.getElementById('worker-unit-' + reportId).value.trim();
    
    if (!description) {
      alert('❌ กรุณากรอกรายละเอียดประเด็น');
      document.getElementById('description-' + reportId).focus();
      return;
    }
    
    if (!workerName) {
      alert('❌ กรุณากรอกชื่อผู้ปฏิบัติงาน');
      document.getElementById('worker-name-' + reportId).focus();
      return;
    }
    
    if (!workerUnit) {
      alert('❌ กรุณากรอกชุดงาน/หน่วยงาน');
      document.getElementById('worker-unit-' + reportId).focus();
      return;
    }
    
    const report = state.reports.find(r => r.id === reportId);
    const unit = state.units.find(u => u.id === parseInt(unitId));
    
    const updates = {
      description: description,          // บันทึกรายละเอียดที่แก้ไข
      workerName: workerName,            // บันทึกชื่อที่แก้ไข
      workerUnit: workerUnit,            // บันทึกหน่วยงานที่แก้ไข
      status: 'assigned',
      assignedTo: unit.name,
      assignedAt: new Date().toISOString()
    };
    
    await updateReport(reportId, updates);
    
    // ส่ง LINE Message
    const lineSuccess = await sendNewReportNotification({...report, ...updates}, parseInt(unitId));
    
    const lineStatus = lineSuccess ? 
      '✅ ส่ง LINE แจ้งเตือนสำเร็จ' : 
      '⚠️ ไม่พบ LINE User ลงทะเบียนหน่วยงานนี้';
    
    alert(`✅ มอบหมายงานสำเร็จ!\n\nรายงานเลขที่: ${report.reportNumber}\nผู้ปฏิบัติงาน: ${workerName}\nหน่วยงาน: ${workerUnit}\nมอบหมายให้: ${unit.name}\n\n${lineStatus}`);
  }

  // ดาวน์โหลดรูปภาพ
  async function downloadImage(imageUrl, filename) {
    try {
      // แสดงสถานะกำลังดาวน์โหลด
      const loadingDiv = document.createElement('div');
      loadingDiv.id = 'downloadLoading';
      loadingDiv.className = 'fixed inset-0 z-[300] bg-black bg-opacity-50 flex items-center justify-center';
      loadingDiv.innerHTML = '<div class="bg-white p-6 rounded-lg text-center"><p class="font-semibold">กำลังดาวน์โหลด...</p></div>';
      document.body.appendChild(loadingDiv);
      
      // Fetch รูปภาพ
      const response = await fetch(imageUrl);
      const blob = await response.blob();
      
      // สร้าง URL สำหรับ download
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename + '.jpg';
      document.body.appendChild(a);
      a.click();
      
      // Cleanup
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
      
      // ลบ loading
      document.getElementById('downloadLoading')?.remove();
      
    } catch (error) {
      console.error('Download error:', error);
      document.getElementById('downloadLoading')?.remove();
      
      // ถ้า fetch ไม่ได้ ให้เปิดในแท็บใหม่แทน
      alert('ไม่สามารถดาวน์โหลดโดยตรงได้\nกรุณากดค้างที่รูป แล้วเลือก "บันทึกรูปภาพ"');
      window.open(imageUrl, '_blank');
    }
  }

  async function selectUnit(unitId) {
    // ขอรหัสผ่านก่อนเข้าดูหน้าหน่วยงาน
    const password = prompt('🔐 กรุณาใส่รหัสผ่านเพื่อเข้าดูข้อมูลหน่วยงาน:');
    if (password === null) return;
    if (!password.trim()) { alert('❌ กรุณาใส่รหัสผ่าน'); return; }
    
    try {
      const ok = await verifyUnitPassword(password);
      if (ok) {
        state.selectedUnitId = unitId;
        state.page = 'unit';
        render();
      } else {
        alert('❌ รหัสผ่านไม่ถูกต้อง!\n\nกรุณาติดต่อหัวหน้าหน่วยงานเพื่อขอรหัสผ่าน');
      }
    } catch(e) {
      alert('เกิดข้อผิดพลาด: ' + e.message);
    }
  }

  async function handleResolveImages(event) {
    const files = Array.from(event.target.files).slice(0, 1); // เอาเพียง 1 รูป
    resolveImagesData = [];
    const preview = document.getElementById('resolveImagePreview');
    preview.innerHTML = '<div class="text-center text-gray-600">⏳ กำลังบีบอัดและอัปโหลดรูป...</div>';
    
    if (files.length === 0) {
      preview.innerHTML = '';
      return;
    }
    
    const file = files[0];
    
    try {
      // บีบอัดรูป
      const compressed = await compressImage(file, 1200, 0.8);
      
      // แสดงตัวอย่างชั่วคราว
      preview.innerHTML = `<div class="text-center text-blue-600">📤 กำลังอัปโหลดรูป...</div>`;
      
      // อัปโหลดไป ImgBB
      const imageUrl = await uploadToImgBB(compressed);
      
      if (imageUrl) {
        resolveImagesData.push(imageUrl);
        
        // แสดงตัวอย่างรูปที่อัปโหลดสำเร็จ
        preview.innerHTML = `
          <div class="relative max-w-md mx-auto">
            <img src="${imageUrl}" class="w-full h-64 object-contain rounded-lg border-2 border-green-300">
            <div class="absolute top-2 right-2 bg-green-600 text-white rounded-full px-3 py-1 text-sm font-semibold">
              ✓ อัปโหลดสำเร็จ
            </div>
          </div>
        `;
      } else {
        preview.innerHTML = '<div class="text-center text-red-600">❌ อัปโหลดไม่สำเร็จ กรุณาลองใหม่</div>';
      }
    } catch (error) {
      console.error('Image processing error:', error);
      preview.innerHTML = '<div class="text-center text-red-600">❌ เกิดข้อผิดพลาด กรุณาลองใหม่</div>';
    }
  }
  
  async function confirmResolve() {
    if (resolveImagesData.length === 0) {
      alert('❌ กรุณาอัปโหลดรูปภาพการแก้ไข');
      return;
    }
    
    const note = document.getElementById('resolveNote').value.trim();
    const report = state.reports.find(r => r.id === currentResolveReportId);
    
    if (confirm(`ยืนยันแนบรูปการแก้ไข?\n\nรายงานเลขที่: ${report.reportNumber}\n\nจะส่งไป Admin เพื่ออนุมัติปิดงาน`)) {
      const updates = {
        status: 'resolved',
        resolveImages: resolveImagesData,
        resolveNote: note,
        resolvedAt: new Date().toISOString()
      };
      
      await updateReport(currentResolveReportId, updates);
      
      // แจ้งเตือน Admin ว่ามีรายงานรออนุมัติ
      notifyAdminPendingApproval({...report, ...updates}).then(success => {
        console.log('📤 Admin approval notification:', success ? 'sent' : 'no admin registered');
      });
      
      closeResolveModal();
      
      alert(`✅ ส่งรูปการแก้ไขเรียบร้อย!\n\nรายงานเลขที่: ${report.reportNumber}\n\nรอ Admin อนุมัติปิดงาน`);
    }
  }

  async function confirmReturn() {
    const reason = document.getElementById('returnReason').value.trim();
    
    if (!reason) {
      alert('❌ กรุณาระบุเหตุผล');
      document.getElementById('returnReason').focus();
      return;
    }
    
    const report = state.reports.find(r => r.id === currentReturnReportId);

  function drawLuckyWheel() {
    const canvas = document.getElementById('luckyWheelCanvas');
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = Math.min(centerX, centerY) - 20;
    
    const segments = [];
    dashboardState.luckyDrawData.forEach(person => {
      for (let i = 0; i < person.count; i++) {
        segments.push({
          name: person.name,
          unit: person.unit,
          personId: person.name
        });
      }
    });
    
    if (segments.length === 0) return;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate((dashboardState.luckyDrawRotation * Math.PI) / 180);
    
    const anglePerSegment = (2 * Math.PI) / segments.length;
    const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', 
                    '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52B788'];
    
    segments.forEach((segment, index) => {
      const startAngle = index * anglePerSegment;
      const endAngle = startAngle + anglePerSegment;
      const color = colors[index % colors.length];
      
      const gradient = ctx.createRadialGradient(0, 0, 50, 0, 0, radius);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, adjustBrightness(color, -20));
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = '#FFF';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.save();
      ctx.rotate(startAngle + anglePerSegment / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFF';
      ctx.shadowColor = 'rgba(0,0,0,0.7)';
      ctx.shadowBlur = 4;
      ctx.font = 'bold 12px Arial';
      ctx.fillText(segment.name, radius - 10, 0);
      ctx.restore();
    });
    
    ctx.restore();
    
    ctx.beginPath();
    ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
    ctx.fillStyle = '#34495E';
    ctx.fill();
    ctx.strokeStyle = '#ECF0F1';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    const arrowX = centerX + radius;
    const arrowY = centerY;
    
    ctx.beginPath();
    ctx.moveTo(arrowX - 15, arrowY);
    ctx.lineTo(arrowX + 50, arrowY - 40);
    ctx.lineTo(arrowX + 50, arrowY + 40);
    ctx.closePath();
    ctx.fillStyle = '#E74C3C';
    ctx.fill();
    ctx.strokeStyle = '#8B0000';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  
  function adjustBrightness(color, amount) {
    const hex = color.replace('#', '');
    const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + amount));
    const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + amount));
    const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + amount));
    return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
  }
  
  function spinLuckyWheel() {
    if (dashboardState.luckyDrawSpinning) return;
    
    const segments = [];
    dashboardState.luckyDrawData.forEach(person => {
      for (let i = 0; i < person.count; i++) {
        segments.push({
          name: person.name,
          unit: person.unit,
          personId: person.name
        });
      }
    });
    
    if (segments.length === 0) {
      alert('❌ ไม่มีผู้เข้าร่วม');
      return;
    }
    
    if (dashboardState.luckyDrawWinners.length >= dashboardState.luckyDrawNumberOfWinners) {
      alert('🎉 ได้ครบจำนวนรางวัลแล้ว!');
      return;
    }
    
    dashboardState.luckyDrawSpinning = true;
    
    const spinDuration = 4000;
    const minSpins = 5;
    const randomSpins = minSpins + Math.random() * 3;
    const extraDegrees = Math.random() * 360;
    const totalRotation = randomSpins * 360 + extraDegrees;
    const startRotation = dashboardState.luckyDrawRotation;
    
    let startTime = null;
    
    const animate = (currentTime) => {
      if (!startTime) startTime = currentTime;
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / spinDuration, 1);
      
      const easeOut = 1 - Math.pow(1 - progress, 3);
      const currentRotation = startRotation + (totalRotation * easeOut);
      
      dashboardState.luckyDrawRotation = currentRotation;
      drawLuckyWheel();
      
      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        const finalRotation = currentRotation % 360;
        const segmentAngle = 360 / segments.length;
        const adjustedRotation = (360 - finalRotation) % 360;
        const winnerIndex = Math.floor(adjustedRotation / segmentAngle) % segments.length;
        
        const winnerSegment = segments[winnerIndex];
        const winner = {
          name: winnerSegment.name,
          unit: winnerSegment.unit
        };
        
        dashboardState.luckyDrawWinners.push(winner);
        dashboardState.luckyDrawData = dashboardState.luckyDrawData.filter(p => p.name !== winner.name);
        dashboardState.luckyDrawSpinning = false;
        
        render();
        
        setTimeout(() => {
          alert(`🎉 ยินดีด้วย!\n\n${winner.name}\n${winner.unit}\n\nได้รับรางวัลที่ ${dashboardState.luckyDrawWinners.length}!`);
          setTimeout(() => drawLuckyWheel(), 100);
        }, 500);
      }
    };
    
    requestAnimationFrame(animate);
  }

  // ฟังก์ชันกรองข้อมูลตามวันที่
  function filterReportsByDate(reports, period, startDate = null, endDate = null) {
    const now = new Date();
    
    return reports.filter(report => {
      if (!report.createdAt) return false;
      
      const reportDate = new Date(report.createdAt);
      
      switch(period) {
        case 'today':
          return reportDate.toDateString() === now.toDateString();
          
        case 'week':
          const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          return reportDate >= weekAgo;
          
        case 'month':
          return reportDate.getMonth() === now.getMonth() && 
                 reportDate.getFullYear() === now.getFullYear();
          
        case 'year':
          return reportDate.getFullYear() === now.getFullYear();
          
        case 'custom':
          if (startDate && endDate) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            end.setHours(23, 59, 59);
            return reportDate >= start && reportDate <= end;
          }
          return true;
          
        default:
          return true;
      }
    });
  }

  // Export ข้อมูลเป็น Excel
  function exportToExcel(reports, filename = 'unsafe-report.xlsx') {
    const data = reports.map(r => ({
      'เลขที่รายงาน': r.reportNumber || '',
      'วันที่พบเหตุการณ์': r.incidentDate ? new Date(r.incidentDate).toLocaleDateString('th-TH') : '',
      'วันที่รายงาน': r.createdAt ? new Date(r.createdAt).toLocaleString('th-TH') : '',
      'ผู้ถูกรายงาน': r.workerName || '',
      'หน่วยงานผู้ถูกรายงาน': r.workerUnit || '',
      'รายละเอียด': r.description || '',
      'สถานะ': r.status === 'pending' ? 'รอมอบหมาย' :
                r.status === 'assigned' ? 'กำลังดำเนินการ' :
                r.status === 'resolved' ? 'รออนุมัติ' :
                r.status === 'approved' ? 'ปิดงานแล้ว' :
                r.status === 'rejected' ? 'ไม่รับลงทะเบียน' : '',
      'มอบหมายให้': r.assignedTo || '',
      'วันที่มอบหมาย': r.assignedAt ? new Date(r.assignedAt).toLocaleString('th-TH') : '',
      'วันที่แก้ไข': r.resolvedAt ? new Date(r.resolvedAt).toLocaleString('th-TH') : '',
      'วันที่อนุมัติ': r.approvedAt ? new Date(r.approvedAt).toLocaleString('th-TH') : ''
    }));
    
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(data);
    ws['!cols'] = [
      { wch: 15 }, { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 25 }, { wch: 40 },
      { wch: 15 }, { wch: 25 }, { wch: 20 }, { wch: 20 }, { wch: 20 }
    ];
    XLSX.utils.book_append_sheet(wb, ws, 'รายงาน');
    XLSX.writeFile(wb, filename);
  }
  
  // Export สถิติผู้รายงาน (Admin only)
  function exportReporterStats(reports, filename = 'reporter-stats.xlsx') {
    const reporterCounts = {};
    reports.forEach(r => {
      const name = r.reporterName || 'ไม่ระบุชื่อ';
      if (!reporterCounts[name]) {
        reporterCounts[name] = {
          name: name,
          title: r.reporterTitle || '',
          unit: r.reporterUnit || '',
          count: 0
        };
      }
      reporterCounts[name].count++;
    });
    
    const data = Object.values(reporterCounts).sort((a, b) => b.count - a.count).map((r, index) => ({
      'อันดับ': index + 1,
      'คำนำหน้า': r.title,
      'ชื่อ-นามสกุล': r.name,
      'หน่วยงาน': r.unit,
      'จำนวนครั้งที่รายงาน': r.count
    }));
    
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(data);
    ws['!cols'] = [{ wch: 8 }, { wch: 12 }, { wch: 25 }, { wch: 30 }, { wch: 20 }];
    XLSX.utils.book_append_sheet(wb, ws, 'สถิติผู้รายงาน');
    XLSX.writeFile(wb, filename);
  }

  function goDashboardPage(page) {
    const total = (() => {
      let r = filterReportsByDate(state.reports, dashboardState.filterPeriod, dashboardState.filterStartDate, dashboardState.filterEndDate);
      const q = (dashboardState.searchQuery || '').trim().toLowerCase();
      if (q) r = r.filter(x => (x.reportNumber||'').toLowerCase().includes(q)||(x.workerName||'').toLowerCase().includes(q)||(x.workerUnit||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q)||(x.assignedTo||'').toLowerCase().includes(q));
      return r.length;
    })();
    const totalPages = Math.ceil(total / dashboardState.pageSize);
    dashboardState.currentPage = Math.max(1, Math.min(page, totalPages));
    render();
    // scroll to report list
    setTimeout(function(){ const el = document.querySelector('.space-y-3'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 100);
  }

  function clearDashboardSearch() {
    dashboardState.searchQuery = '';
    dashboardState.currentPage = 1;

  // ================== INIT ==================
  // ================== INIT ==================
  async function init() {
    console.log('🚀 Initializing Unsafe-Report with Firebase...');
    
    try {
      // 0. Check URL parameters for direct navigation (Rich Menu)
      const urlParams = new URLSearchParams(window.location.search);
      const pageParam = urlParams.get('page');
      if (pageParam && ['report', 'tracking', 'dashboard', 'admin'].includes(pageParam)) {
        state.page = pageParam;
        console.log('📍 Direct navigation to:', pageParam);
      }
      
      // 1. Initialize Firebase
      if (typeof firebase === 'undefined') {
        throw new Error('Firebase SDK not loaded');
      }
      
      firebaseApp = firebase.initializeApp(firebaseConfig);
      database = firebase.database();
      auth = firebase.auth();
      googleProvider = new firebase.auth.GoogleAuthProvider();
      isFirebaseReady = true;
      console.log('✅ Firebase initialized successfully');
      
      // 2. Load initial data
      await loadReports();
      
      // 3. Setup real-time sync
      setupRealtimeListeners();
      
      // 4. Render UI
      render();
      
      console.log('✅ App initialized successfully!');
      console.log('🔄 Real-time sync is active - changes will appear instantly!');
      
    } catch (error) {
      console.error('❌ Initialization error:', error);
      alert('⚠️ ไม่สามารถเชื่อมต่อ Firebase ได้\n\nกรุณา:\n1. Refresh หน้าเว็บ (Ctrl+Shift+R)\n2. ตรวจสอบ Internet\n3. ลองเปิดในโหมด Incognito\n\nError: ' + error.message);
    }
  }
  
  // Start app
  window.addEventListener('DOMContentLoaded', init);
  </script>
