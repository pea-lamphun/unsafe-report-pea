<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#DC2626">
  <title>Unsafe-Report - กฟจ.ลำพูน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <!-- PDF Generation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- Firebase SDK v9 (compat) - จาก jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <style>
    input,select,textarea{font-size:16px!important}
    html{scroll-behavior:smooth}
    *{scrollbar-width:thin;scrollbar-color:#DC2626 #f1f1f1}
    *::-webkit-scrollbar{width:8px}
    *::-webkit-scrollbar-track{background:#f1f1f1}
    *::-webkit-scrollbar-thumb{background:#DC2626;border-radius:4px}
    .chart-box{height:300px}
    .chart-box-tall{height:300px}
    @media (max-width:767px){.chart-box-tall{height:400px}}
    .modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.5);align-items:center;justify-content:center}
    .modal.active{display:flex}
    .image-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.9);align-items:center;justify-content:center;padding:20px}
    .image-modal.active{display:flex}
    .image-modal img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px}
    .image-modal-close{position:absolute;top:20px;right:20px;background:white;color:#DC2626;padding:10px 20px;border-radius:50px;font-weight:bold;cursor:pointer;font-size:18px}
    .image-modal-close:hover{background:#DC2626;color:white}
  
    /* ═══════════════ v3.0 — Design system (ur-*) ═══════════════ */
    :root{
      --ur-font:'Noto Sans Thai','Sarabun',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      --ur-mono:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      --ur-ink:#1F2328;--ur-ink2:#4B5563;--ur-ink3:#6B7280;--ur-ink4:#9CA3AF;
      --ur-line:#E5E7EB;--ur-line2:#F1F2F4;--ur-paper:#F6F5F4;
      --ur-ease:cubic-bezier(.2,.7,.3,1);
    }
    body{font-family:var(--ur-font);-webkit-font-smoothing:antialiased;background:var(--ur-paper)}
    .ur-mono{font-family:var(--ur-mono);font-variant-numeric:tabular-nums}
    .ur-page{min-height:100vh;background:var(--ur-paper);color:var(--ur-ink);line-height:1.6}
    .ur-page button{font-family:inherit}
    @media (prefers-reduced-motion:reduce){.ur-page *,.ur-modal *{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    /* สีประจำเมนู/ประเภท */
    .ur-c-red{--tc:#DC2626;--tb:#FEE2E2;--tg:rgba(220,38,38,.30);--td:#991B1B}
    .ur-c-blue{--tc:#2563EB;--tb:#DBEAFE;--tg:rgba(37,99,235,.28);--td:#1E3A8A}
    .ur-c-orange{--tc:#EA580C;--tb:#FFEDD5;--tg:rgba(234,88,12,.28);--td:#9A3412}
    .ur-c-violet{--tc:#7C3AED;--tb:#EDE9FE;--tg:rgba(124,58,237,.28);--td:#4C1D95}
    .ur-c-amber{--tc:#B45309;--tb:#FEF3C7;--tg:rgba(180,83,9,.30);--td:#78350F}
    .ur-c-fuchsia{--tc:#A21CAF;--tb:#FAE8FF;--tg:rgba(162,28,175,.28);--td:#701A75}
    .ur-c-teal{--tc:#0F766E;--tb:#CCFBF1;--tg:rgba(15,118,110,.28);--td:#134E4A}
    .ur-c-indigo{--tc:#4338CA;--tb:#E0E7FF;--tg:rgba(67,56,202,.28);--td:#312E81}

    /* ── หัวหน้าแรก ── */
    .ur-hero{position:relative;overflow:hidden;color:#fff;padding:30px 16px 92px;
      background:linear-gradient(135deg,#F05252 0%,#DC2626 45%,#9B1C1C 100%)}
    .ur-hero::before{content:"";position:absolute;right:-90px;top:-130px;width:330px;height:330px;border-radius:50%;background:rgba(255,255,255,.10)}
    .ur-hero::after{content:"";position:absolute;left:-70px;bottom:-150px;width:270px;height:270px;border-radius:50%;background:rgba(255,255,255,.07)}
    .ur-hero-in{position:relative;z-index:1;max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px}
    .ur-logo{width:74px;height:74px;border-radius:22px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 10px 24px rgba(0,0,0,.20)}
    .ur-logo img{width:60px;height:60px;object-fit:contain}
    .ur-hero-k{font-size:12.5px;font-weight:600;opacity:.88}
    .ur-hero-t{font-size:29px;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:1px 0 2px}
    .ur-hero-d{font-size:14.5px;opacity:.93}
    .ur-wrap{max-width:760px;margin:-62px auto 0;padding:0 16px 40px;position:relative;z-index:2}
    .ur-foot{text-align:center;color:var(--ur-ink3);font-size:12.5px;margin-top:24px;line-height:1.75}
    @media(max-width:480px){.ur-hero{padding:24px 16px 86px}.ur-logo{width:62px;height:62px;border-radius:18px}.ur-logo img{width:50px;height:50px}.ur-hero-t{font-size:25px}.ur-hero-d{font-size:13.5px}}

    /* ── การ์ดเมนู (ลูกเล่นแบบระบบจัดการอุปกรณ์ฯ) ── */
    .ur-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
    .ur-tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .ur-tiles.one{grid-template-columns:1fr}
    :where(.ur-tile){--tc:#DC2626;--tb:#FEE2E2;--tg:rgba(220,38,38,.28)}
    .ur-tile{
      position:relative;overflow:hidden;width:100%;text-align:left;background:#fff;border:1.5px solid var(--tb);border-radius:18px;
      padding:22px 20px 18px;display:flex;flex-direction:column;cursor:pointer;color:var(--ur-ink);
      box-shadow:0 2px 5px rgba(30,20,20,.05),0 8px 18px -10px var(--tg);
      transition:box-shadow .2s var(--ur-ease),border-color .2s,transform .16s var(--ur-ease)}
    .ur-tile::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;z-index:2;background:var(--tc);transition:height .18s var(--ur-ease)}
    .ur-tile::after{content:"";position:absolute;right:-42px;top:-42px;width:116px;height:116px;border-radius:50%;background:var(--tb);opacity:.62;
      transition:transform .35s var(--ur-ease),opacity .2s}
    .ur-tile:hover{border-color:var(--tc);transform:translateY(-4px);box-shadow:0 4px 10px rgba(30,20,20,.06),0 18px 34px -12px var(--tg)}
    .ur-tile:hover::before{height:7px}
    .ur-tile:hover::after{transform:scale(1.5);opacity:.5}
    .ur-tile:active{transform:translateY(-1px);box-shadow:0 2px 6px rgba(30,20,20,.08)}
    .ur-tile:focus-visible{outline:3px solid var(--tc);outline-offset:3px}
    .ur-tile-ic{position:relative;z-index:1;width:50px;height:50px;border-radius:15px;background:var(--tc);color:#fff;display:grid;place-items:center;
      margin-bottom:14px;flex:none;box-shadow:0 4px 11px -2px var(--tg);transition:transform .2s var(--ur-ease),box-shadow .2s}
    .ur-tile:hover .ur-tile-ic{transform:scale(1.07) rotate(-4deg);box-shadow:0 7px 16px -3px var(--tg)}
    .ur-tile-body{position:relative;z-index:1;min-width:0}
    .ur-tile-k{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--tc);text-transform:uppercase;line-height:1.4}
    .ur-tile-t{font-weight:700;font-size:16.5px;line-height:1.35;margin-bottom:3px;transition:color .16s}
    .ur-tile:hover .ur-tile-t{color:var(--tc)}
    .ur-tile-d{font-size:12.8px;color:var(--ur-ink3);line-height:1.55}
    .ur-tile-cta{position:relative;z-index:1;margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--tc)}
    .ur-tile-arrow{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--tb);color:var(--tc);flex:none;transition:all .2s var(--ur-ease)}
    .ur-tile:hover .ur-tile-arrow{background:var(--tc);color:#fff;transform:translateX(4px)}
    .ur-tile .ur-badge{position:absolute;z-index:3;top:12px;right:12px;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:#F59E0B;color:#fff;
      font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 3px 8px rgba(245,158,11,.45)}
    /* การ์ดหลัก (ทึบ) */
    .ur-tile.solid{background:linear-gradient(135deg,#F05252 0%,#DC2626 50%,#B91C1C 100%);border-color:transparent;color:#fff;
      box-shadow:0 14px 30px -12px rgba(220,38,38,.60);padding:24px 22px 20px}
    .ur-tile.solid::before{height:0}
    .ur-tile.solid::after{background:rgba(255,255,255,.14);opacity:1;width:150px;height:150px;right:-50px;top:-55px}
    .ur-tile.solid .ur-tile-ic{background:rgba(255,255,255,.2);box-shadow:none;width:56px;height:56px}
    .ur-tile.solid .ur-tile-t{color:#fff;font-size:22px}
    .ur-tile.solid .ur-tile-d,.ur-tile.solid .ur-tile-k{color:rgba(255,255,255,.9)}
    .ur-tile.solid .ur-tile-cta{color:#fff}
    .ur-tile.solid .ur-tile-arrow{background:rgba(255,255,255,.22);color:#fff}
    .ur-tile.solid:hover{box-shadow:0 20px 40px -14px rgba(220,38,38,.70)}
    .ur-tile.solid:hover .ur-tile-t{color:#fff}
    .ur-tile.solid:hover .ur-tile-arrow{background:#fff;color:#DC2626}
    /* จอเล็ก: การ์ดแนวนอน ประหยัดพื้นที่ */
    @media(max-width:600px){
      .ur-tiles,.ur-tiles.three{grid-template-columns:1fr;gap:12px}
      .ur-tiles .ur-tile{flex-direction:row;align-items:center;gap:14px;padding:16px 16px 16px 18px}
      .ur-tiles .ur-tile::before{top:0;bottom:0;right:auto;width:5px;height:auto}
      .ur-tiles .ur-tile:hover::before{width:7px;height:auto}
      .ur-tiles .ur-tile-ic{margin:0;width:46px;height:46px;border-radius:14px}
      .ur-tiles .ur-tile-body{flex:1}
      .ur-tiles .ur-tile-cta{margin:0;padding:0}
      .ur-tiles .ur-tile-cta .ur-cta-t{display:none}
      .ur-tiles .ur-tile .ur-badge{top:8px;right:8px}
    }

    /* ── กล่องรวมรายงานความปลอดภัย ── */
    .ur-group{position:relative;background:#fff;border:2px solid #FECACA;border-radius:22px;padding:16px;
      box-shadow:0 12px 32px -20px rgba(220,38,38,.55)}
    .ur-group-h{display:flex;align-items:center;gap:11px;margin:2px 4px 14px}
    .ur-group-ic{width:36px;height:36px;border-radius:12px;background:#DC2626;color:#fff;display:grid;place-items:center;flex:none}
    .ur-group-t{font-weight:700;font-size:16px;color:#991B1B;line-height:1.3}
    .ur-group-s{font-size:12.5px;color:var(--ur-ink3)}
    .ur-or{display:flex;align-items:center;gap:12px;margin:22px 6px 18px;color:var(--ur-ink4);font-size:12.5px;font-weight:600}
    .ur-or::before,.ur-or::after{content:"";flex:1;height:1px;background:#D9D9D9}

    /* ── แถบหัวของหน้าย่อย ── */
    .ur-top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--ur-line)}
    .ur-top-in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
    .ur-back{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:14px;color:var(--ur-ink2);padding:7px 12px 7px 8px;border-radius:11px;border:1px solid var(--ur-line);background:#fff;flex:none;cursor:pointer}
    .ur-back:hover{background:#F9FAFB;color:var(--ur-ink)}
    .ur-top-t{font-weight:700;font-size:15.5px;line-height:1.3}
    .ur-top-s{font-size:12px;color:var(--ur-ink3);line-height:1.35}
    .ur-body{max-width:1000px;margin:0 auto;padding:16px 16px 56px}
    .ur-body.narrow{max-width:720px}

    /* ── การ์ด/ฟอร์ม ── */
    .ur-card{background:#fff;border:1px solid var(--ur-line);border-radius:18px;padding:18px;
      box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -18px rgba(0,0,0,.22)}
    .ur-card + .ur-card{margin-top:14px}
    .ur-sec{display:flex;align-items:center;gap:11px;margin-bottom:16px}
    .ur-sec-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tb,#F3F4F6);color:var(--tc,#374151)}
    .ur-sec-t{font-weight:700;font-size:16px;line-height:1.3}
    .ur-sec-s{font-size:12.5px;color:var(--ur-ink3);line-height:1.4}
    .ur-field{margin-bottom:18px}
    .ur-field:last-child{margin-bottom:0}
    .ur-lbl{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-weight:600;font-size:14.5px;margin-bottom:8px;color:var(--ur-ink);line-height:1.45}
    .ur-lbl .n{display:inline-grid;place-items:center;min-width:25px;height:25px;border-radius:8px;background:var(--tb,#F3F4F6);color:var(--tc,#374151);
      font-size:12.5px;font-weight:700;font-family:var(--ur-mono);flex:none}
    .ur-lbl .req{color:#DC2626}
    .ur-lbl small{font-weight:500;color:var(--ur-ink3);font-size:12.5px}
    .ur-inp{display:block;width:100%;padding:11px 13px;border:1.5px solid #D1D5DB;border-radius:12px;background:#fff;color:var(--ur-ink);outline:none;
      transition:border-color .15s,box-shadow .15s;line-height:1.5}
    .ur-inp:focus{border-color:var(--tc,#DC2626);box-shadow:0 0 0 3px var(--tb,#FEE2E2)}
    .ur-inp[disabled]{background:#F3F4F6;color:var(--ur-ink4)}
    .ur-inp.bad{border-color:#DC2626;box-shadow:0 0 0 3px #FEE2E2}
    textarea.ur-inp{resize:vertical;min-height:112px;line-height:1.65}
    .ur-hint{font-size:12.5px;color:var(--ur-ink3);margin-top:6px;line-height:1.55}
    .ur-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .ur-grid3{display:grid;grid-template-columns:120px 1fr 1fr;gap:12px}
    @media(max-width:560px){.ur-grid2,.ur-grid3{grid-template-columns:1fr}}
    .ur-typehead{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 18px;color:#fff;
      background:linear-gradient(135deg,var(--tc) 0%,var(--td,#7F1D1D) 100%);box-shadow:0 14px 30px -16px var(--tg)}
    .ur-typehead::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.13)}
    .ur-typehead > *{position:relative;z-index:1}
    .ur-typehead-k{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:.92;font-weight:600}
    .ur-typehead-t{font-size:20px;font-weight:700;line-height:1.35;margin-top:3px}
    .ur-typehead-d{font-size:13px;opacity:.92;margin-top:5px}

    /* ── ปุ่ม ── */
    .ur-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14.5px;
      background:var(--tc,#DC2626);color:#fff;border:1.5px solid transparent;cursor:pointer;line-height:1.3;text-decoration:none;
      transition:filter .15s,box-shadow .15s,transform .1s,background .15s}
    .ur-btn:hover{filter:brightness(1.07);box-shadow:0 8px 18px -8px var(--tg,rgba(0,0,0,.35))}
    .ur-btn:active{transform:translateY(1px)}
    .ur-btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none;filter:none;transform:none}
    .ur-btn.ghost{background:#fff;color:var(--tc,#DC2626);border-color:var(--ur-line)}
    .ur-btn.ghost:hover{background:var(--tb,#FEF2F2);border-color:var(--tc,#DC2626);filter:none}
    .ur-btn.neutral{background:#F3F4F6;color:var(--ur-ink2);border-color:transparent}
    .ur-btn.neutral:hover{background:#E5E7EB;filter:none;box-shadow:none}
    .ur-btn.danger{background:#fff;color:#B91C1C;border-color:#FCA5A5}
    .ur-btn.danger:hover{background:#FEF2F2;filter:none}
    .ur-btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
    .ur-btn.xs{padding:4px 10px;font-size:12px;border-radius:8px;gap:5px}
    .ur-btn.lg{padding:15px 22px;font-size:16.5px;border-radius:14px}
    .ur-btn.block{width:100%}
    .ur-icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--ur-line);background:#fff;color:var(--ur-ink2);cursor:pointer;transition:all .15s;flex:none}
    .ur-icon-btn:hover{background:#F3F4F6;color:var(--ur-ink)}
    .ur-icon-btn.danger:hover{background:#FEF2F2;color:#B91C1C;border-color:#FCA5A5}
    .ur-link{color:var(--tc,#2563EB);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:none;padding:0;font-size:inherit}

    /* ── ช่องค้นหารายชื่อ ── */
    .ur-ta{position:relative}
    .ur-ta .ur-inp{padding-left:42px}
    .ur-ta-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ur-ink4);display:flex;pointer-events:none}
    .ur-ta-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:#fff;border:1px solid var(--ur-line);border-radius:14px;
      box-shadow:0 18px 40px -12px rgba(0,0,0,.30);max-height:330px;overflow-y:auto;padding:6px;animation:urIn .15s var(--ur-ease)}
    .ur-ta-item{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:10px;cursor:pointer}
    .ur-ta-item:hover,.ur-ta-item.on{background:var(--tb,#FEF2F2)}
    .ur-ta-id{font-family:var(--ur-mono);font-size:12.5px;color:var(--td,#991B1B);min-width:66px;padding-top:2px}
    .ur-ta-n{font-weight:600;line-height:1.35}
    .ur-ta-s{font-size:12.5px;color:var(--ur-ink3);line-height:1.4}
    .ur-ta-empty{padding:14px 12px;font-size:13.5px;color:var(--ur-ink3);text-align:center;line-height:1.6}
    .ur-who{display:flex;align-items:center;gap:12px;background:var(--tb,#FEF2F2);border:1.5px solid var(--tc,#DC2626);border-radius:14px;padding:12px 14px;animation:urIn .2s var(--ur-ease)}
    .ur-who-ic{width:42px;height:42px;border-radius:12px;background:var(--tc,#DC2626);color:#fff;display:grid;place-items:center;flex:none}
    .ur-who-n{font-weight:700;line-height:1.35}
    .ur-who-s{font-size:12.5px;color:var(--ur-ink2);line-height:1.45}

    /* ── สวิตช์ไม่ประสงค์ออกนาม ── */
    .ur-switch{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px dashed #CBD0D6;border-radius:14px;cursor:pointer;
      user-select:none;-webkit-user-select:none;background:#FAFAFA;margin-top:14px;line-height:1.4}
    .ur-switch input{position:absolute;opacity:0;width:1px;height:1px}
    .ur-switch-t{width:46px;height:27px;border-radius:99px;background:#CBD0D6;position:relative;flex:none;transition:background .18s}
    .ur-switch-t::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s var(--ur-ease)}
    .ur-switch input:checked + .ur-switch-t{background:#374151}
    .ur-switch input:checked + .ur-switch-t::after{transform:translateX(19px)}

    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function verifyUnitPassword(input) {
    const snap = await database.ref('config/unitPasswordHash').get();
    if (!snap.exists()) return false;
    const stored = snap.val();
    const inputHash = await hashPassword(input);
    return inputHash === stored;
  }

  // ── การเรียงรายชื่อ (เงื่อนไขเดียวกับระบบจัดการอุปกรณ์ฯ และ Safety Talk) ──

  const WORKER_RANK = [

  const DEPT_ORDER = ['กฟจ.ลำพูน', 'ผกส.', 'ผปบ.', 'ผมต.', 'ผบร.', 'ผบส.', 'ผสน.', 'ผคพ.', 'ผบง.', 'ผปร.', 'ผบค.'];

  // ── เซ็นเซอร์นามสกุล (แพตเทิร์นเดียวกับ Safety Talk / PPE) "นายเกียรติพงษ์ นุ่มนวล" → "นายเกียรติพงษ์ นุ่ม***" ──
  const TH_CONS = 'กขฃคฅฆงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ';

  // ── ทะเบียนรายชื่อ ──

  // ── ใบงานไม่ออกนาม: ติ๊กไม่ประสงค์ออกนาม (v3.0) หรือใบงานเก่าที่พิมพ์ชื่อว่า "ไม่ประสงค์ออกนาม" / ไม่ระบุ / เว้นว่าง ──

  //  ลำดับการจับคู่: key จากทะเบียน → รหัสประจำตัว → ชื่อ-นามสกุล (กรณีใบงานเก่าหรือกรอกเอง)

  function isAcceptedSafety(r) {

  function hidKey(id) { return encodeURIComponent(String(id)).replace(/\./g, '%2E'); }
  function reporterStats(reports) {
    const m = {};
    (reports || []).forEach(r => {
      if (!isAcceptedSafety(r)) return;
      const who = identityOf(r);
      if (!who) return;
      const h = (emp.hidden || {})[hidKey(who.id)];
      if (h && h.hiddenAt && new Date(r.createdAt || 0) <= new Date(h.hiddenAt)) return;   // ลบออกจากตารางแล้ว นับเฉพาะใบใหม่หลังจากนั้น
      if (!m[who.id]) {
        const sp = splitName(who.name);
        m[who.id] = { id: who.id, name: who.name, title: sp.title, firstName: sp.first, lastName: sp.last, unit: who.unit, empId: who.empId, count: 0 };
      }
      m[who.id].count++;
    });
    return Object.values(m).sort((a, b) => b.count - a.count || String(a.name).localeCompare(String(b.name), 'th'));

  function manualPending() {

      const who = identityOf(r);

      });
      g.reportIds.push(r.id);

  // ================== IMAGE COMPRESSION & UPLOAD ==================
  async function compressImage(file, maxWidth = 1200, quality = 0.8) {
    // จำกัดขนาดไฟล์ 30MB — กัน RAM มือถือเต็ม
    if (file.size > 30 * 1024 * 1024) {
      throw new Error('ไฟล์ใหญ่เกิน 30MB กรุณาเลือกรูปที่เล็กกว่านี้');
    }

    return new Promise((resolve, reject) => {
      // timeout 30 วินาที — กันค้างถาวร
      const timer = setTimeout(() => {
        reject(new Error('ประมวลผลรูปนานเกินไป กรุณาลองใหม่'));
      }, 30000);

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();

        img.onload = () => {
          clearTimeout(timer);
          try {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (!blob) {
                reject(new Error('ไม่สามารถบีบอัดรูปภาพได้'));
                return;
              }
              const compressedReader = new FileReader();
              compressedReader.onload  = (ev) => resolve(ev.target.result);
              compressedReader.onerror = () => reject(new Error('อ่านไฟล์หลังบีบอัดไม่ได้'));
              compressedReader.readAsDataURL(blob);
            }, 'image/jpeg', quality);
          } catch (err) {
            reject(err);
          }
        };

        // สำคัญ: จับกรณี decode ไม่ได้ (HEIC จาก iPhone / ไฟล์เสีย)
        img.onerror = () => {
          clearTimeout(timer);
          reject(new Error('ไม่สามารถอ่านรูปภาพได้ (รองรับ JPG, PNG, WEBP)'));
        };

        img.src = e.target.result;
      };
      reader.onerror = () => {
        clearTimeout(timer);
        reject(new Error('ไม่สามารถอ่านไฟล์ได้'));
      };
      reader.readAsDataURL(file);
    });
  }
  
  async function uploadToImgBB(base64Image, retryCount = 0) {
    const MAX_RETRIES = 1;
    const TIMEOUT_MS  = 30000;

    try {
      const base64Data = base64Image.split(',')[1];
      if (!base64Data) throw new Error('ข้อมูลรูปว่างเปล่า');

      const formData = new FormData();
      formData.append('image', base64Data);

      // timeout 30 วินาที — กันเน็ตช้าแล้วค้าง
      const controller = new AbortController();
      const timeoutId  = setTimeout(() => controller.abort(), TIMEOUT_MS);

      let response;
      try {
        response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: formData,
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeoutId);
      }

      if (!response.ok) throw new Error('HTTP ' + response.status);

      const data = await response.json();

      if (data.success) {
        return data.data.url;
      } else {
        throw new Error((data.error && data.error.message) || 'Upload failed');
      }
    } catch (error) {
      // ลองใหม่อัตโนมัติ 1 ครั้ง (เน็ตมือถือไม่เสถียร)
      if (retryCount < MAX_RETRIES && error.name !== 'AbortError') {
        console.warn('ImgBB retry ' + (retryCount + 1) + '/' + MAX_RETRIES);
        await new Promise(r => setTimeout(r, 1500));
        return uploadToImgBB(base64Image, retryCount + 1);
      }
      const msg = error.name === 'AbortError'
        ? 'อัปโหลดหมดเวลา (30 วินาที) — สัญญาณอาจอ่อน'
        : (error.message || 'อัปโหลดล้มเหลว');
      console.error('ImgBB upload error:', msg);
      return null;
    }
  }

  // ================== ที่เก็บรูปหลายชั้น (v2.7) ==================
  // ลำดับ: Cloudinary (หลัก) → ImgBB (สำรอง)
  // ถ้าตัวแรกล่ม ระบบสลับไปตัวถัดไปให้อัตโนมัติ
  const CLOUDINARY_CLOUD  = 'gj8tuny1';
  const CLOUDINARY_PRESET = 'pea_upload';   // Unsigned preset
  const CLOUDINARY_FOLDER = 'unsafe-report';

  // เก็บผลการอัปโหลดครั้งล่าสุด ไว้แสดงให้ผู้ใช้เห็น
  let lastUploadInfo = { provider: null, errors: [] };

  async function uploadToCloudinary(base64Image, opts) {
    opts = opts || {};
    const attempt   = opts.attempt || 0;
    const useFolder = opts.useFolder !== false;
    const TIMEOUT_MS = 25000;

    const fd = new FormData();
    fd.append('file', base64Image);               // รับ data URL ได้โดยตรง
    fd.append('upload_preset', CLOUDINARY_PRESET);
    if (useFolder) fd.append('asset_folder', CLOUDINARY_FOLDER);

    const controller = new AbortController();
    const timer = setTimeout(function() { controller.abort(); }, TIMEOUT_MS);

    let res;
    try {
      res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', {
        method: 'POST',
        body: fd,
        signal: controller.signal
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw new Error('หมดเวลา 25 วินาที');
      // เน็ตสะดุด — ลองใหม่อีก 1 ครั้ง
      if (attempt < 1) {
        await new Promise(function(r) { setTimeout(r, 1000); });
        return uploadToCloudinary(base64Image, { attempt: attempt + 1, useFolder: useFolder });
      }
      throw new Error('เชื่อมต่อไม่ได้');
    } finally {
      clearTimeout(timer);
    }

    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }

    if (res.ok && data && data.secure_url) {
      return data.secure_url;
    }

    const msg = (data && data.error && data.error.message) || ('HTTP ' + res.status);

    // กันพลาด: ถ้าติดเรื่องพารามิเตอร์โฟลเดอร์ ลองใหม่แบบไม่ระบุโฟลเดอร์
    if (useFolder && res.status === 400 && /folder/i.test(msg)) {
      return uploadToCloudinary(base64Image, { attempt: attempt, useFolder: false });
    }
    throw new Error(msg);
  }

  // อัปโหลดแบบมีสำรอง — คืนค่า URL หรือ null
  async function uploadImageWithFallback(base64Image) {
    lastUploadInfo = { provider: null, errors: [] };

    // ชั้นที่ 1: Cloudinary
    try {
      const url = await uploadToCloudinary(base64Image);
      if (url) {
        lastUploadInfo.provider = 'Cloudinary';
        return url;
      }
    } catch (e) {
      lastUploadInfo.errors.push('Cloudinary: ' + ((e && e.message) || 'ล้มเหลว'));
      console.warn('Cloudinary ล้มเหลว → สลับไป ImgBB', e);
    }

    // ชั้นที่ 2: ImgBB
    const url2 = await uploadToImgBB(base64Image);
    if (url2) {
      lastUploadInfo.provider = 'ImgBB';
      return url2;
    }
    lastUploadInfo.errors.push('ImgBB: ล้มเหลว');

    return null;
  }

      { type: 'text', text: lineTxt(value, opt.max || 300), size: opt.size || 'md', wrap: true, color: opt.vcolor || '#333333' }
    ] };

  function flexCallout(text, color, bg) {
    return { type: 'box', layout: 'vertical', margin: 'lg', backgroundColor: bg, paddingAll: '12px', cornerRadius: '8px',
             contents: [{ type: 'text', text: text, size: 'sm', color: color, weight: 'bold', wrap: true }] };

  function flexTypeBar(t) {

    if (o.typeKey) body.push(flexTypeBar(o.typeKey));

    };

  function attachSummary(r) {

  let deferredRender = null;
  function userIsBusy() {
    const a = document.activeElement;
    if (a && a !== document.body && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
    return !!document.querySelector('.modal.active, .image-modal.active, .ur-modal, #extBrowserModal, #lineUserModal, #imageDownloadModal');

    if (state.page === 'report') return;                 // ฟอร์มรายงานไม่ได้ใช้ข้อมูลใบงานอื่น — ไม่วาดทับสิ่งที่กำลังกรอก
    if (dashboardState.luckyDrawActive) return;          // กำลังจับรางวัล — ไม่ขัดวงล้อ
    if (userIsBusy()) {
      if (!deferredRender) deferredRender = setTimeout(() => { deferredRender = null; safeRender(); }, 1200);
      return;
    }
    render();

  // ================== หน้า Admin (จป.วิชาชีพ) ==================
  const STATUS_TEXT = { pending: 'รอมอบหมาย', assigned: 'กำลังดำเนินการ', resolved: 'รออนุมัติปิดงาน', approved: 'ปิดงานแล้ว', rejected: 'ไม่รับลงทะเบียน' };
  const STATUS_CHIP = { pending: 'warn', assigned: 'info', resolved: 'info', approved: 'ok', rejected: 'bad' };
  function statusChip(r) {
    let t = STATUS_TEXT[r.status] || 'อื่นๆ', k = STATUS_CHIP[r.status] || 'mute';
    if (r.status === 'assigned' && r.returnReason) { t = 'ถูกตีกลับ'; k = 'warn'; }
    if (r.status === 'assigned' && typeOf(r) === 'RP' && !r.repairResponse) { t = 'รอหน่วยงานตอบรับ'; k = 'warn'; }
    return '<span class="ur-chip sm ' + k + '">' + esc(t) + '</span>';
  }
  function thumbsHtml(imgs, label) {
    return '<div class="ur-thumbs">' + imgs.map((u, i) =>
      '<button type="button" class="ur-thumb" onclick="showImageModal(' + ja(u) + ')" title="ดูรูปขนาดเต็ม">' +
        '<img src="' + esc(u) + '" alt="' + esc(label) + ' ' + (i + 1) + '" loading="lazy"><span class="ur-thumb-n">' + (i + 1) + '</span></button>'
    ).join('') + '</div>';
  }
  function resolveGroups(r) {
    const L = imgList(r.resolveLetterImages), F = imgList(r.resolveFixImages);
    if (L.length || F.length) {
      return [
        L.length ? { k: 'letter', t: typeOf(r) === 'UA' ? 'ใบแจ้งเตือนที่ลงนาม / รูปการแก้ไข' : 'ใบแจ้งเตือนที่ลงนามแล้ว', imgs: L } : null,
        F.length ? { k: 'fix', t: 'รูปหลังการแก้ไข', imgs: F } : null
      ].filter(Boolean);
    }
    const A = imgList(r.resolveImages);
    return A.length ? [{ k: 'all', t: 'รูปการแก้ไข / ใบแจ้งเตือนที่ลงนาม', imgs: A }] : [];
  }
  function resolveGroupsHtml(r) {
    return resolveGroups(r).map(g =>
      '<div class="ur-attach"><div class="ur-attach-t">' + ic(g.k === 'fix' ? 'wrench' : 'file', 15) + ' ' + esc(g.t) + ' <span class="ur-mono">(' + g.imgs.length + ')</span></div>' +
      thumbsHtml(g.imgs, g.t) + '</div>').join('');
  }
  function historyList(r) {
    const h = r.rejectHistory;
    return Array.isArray(h) ? h.filter(Boolean) : (h && typeof h === 'object' ? Object.values(h).filter(Boolean) : []);
  }
  function historyHtml(r) {
    const h = historyList(r);
    if (!h.length) return '';
    return '<div class="ur-msg w" style="display:block"><b>ประวัติการตีกลับ</b>' + h.map((x, i) =>
      '<div style="margin-top:3px">ครั้งที่ ' + (i + 1) + ': ' + esc(x.reason || '-') + ' <span style="opacity:.75">(' + esc(fmtDT(x.timestamp)) + ')</span></div>').join('') + '</div>';
  }
  function repairRespHtml(r) {
    if (typeOf(r) !== 'RP' || !r.repairResponse) return '';
    const R = REPAIR_RESP[r.repairResponse] || REPAIR_RESP.fix_now;
    return '<div class="ur-resp-done" style="--tc:' + R.c + ';--tb:' + R.b + '">' + ic(R.icon, 17) +
      '<div><b>หน่วยงานตอบรับ: ' + esc(R.t) + '</b><div class="ur-hint" style="margin:0">' + esc(fmtDT(r.repairRespondedAt)) +
      (r.repairRespondNote ? ' · ' + esc(r.repairRespondNote) : '') + '</div></div></div>';
  }
  function reportHead(r, extra) {
    return '<div class="ur-rhead">' + typeChip(r) + statusChip(r) + (extra || '') +
      '<span class="ur-rno">เลขที่ <b class="ur-mono">' + esc(r.reportNumber || '-') + '</b></span></div>';
  }

  async function hideStat(id) {
    const row = reporterStats(adminStatsReports()).find(x => x.id === id) || reporterStats(state.reports).find(x => x.id === id);
    const name = row ? row.name : id;
    if (!confirm('ลบ “' + name + '” ออกจากตารางสถิติผู้รายงาน?\n\n• รายงานทุกใบยังอยู่ครบ ไม่ถูกลบ\n• รายงานเดิมของผู้นี้จะไม่นับในตารางสถิติและการจับรางวัล\n• ถ้ารายงานใหม่หลังจากนี้ จะเริ่มนับใหม่\n• กด “คืนค่า” ได้ภายหลัง')) return;
    try {
      await database.ref('config/statsHidden/' + hidKey(id)).set(cleanObj({
        id: id, name: name, unit: row ? row.unit : '', count: row ? row.count : 0, hiddenAt: new Date().toISOString(),
        by: (state.adminUser && state.adminUser.email) || ''
      }));
      toast('ลบออกจากตารางสถิติแล้ว (รายงานยังอยู่ครบ)');
    } catch (e) { alert('❌ บันทึกไม่สำเร็จ: ' + (e && e.message) + (isDenied(e) ? '\n\nต้องอัปเดต Firebase Rules ชุด v3.0 ก่อน' : '')); }
  }
  async function restoreStat(id) {
    try { await database.ref('config/statsHidden/' + hidKey(id)).remove(); toast('คืนค่ารายชื่อเข้าตารางสถิติแล้ว'); }
    catch (e) { alert('❌ คืนค่าไม่สำเร็จ: ' + (e && e.message)); }
  }

  // ── การตอบรับเรื่องแจ้งซ่อม: แจ้งเด้งให้ จป. รับทราบ ──
  function repairUnacked() {
    return state.reports.filter(r => typeOf(r) === 'RP' && r.repairResponse && !r.repairAckAt && r.status !== 'rejected')
      .sort((a, b) => String(b.repairRespondedAt || '').localeCompare(String(a.repairRespondedAt || '')));
  }
  async function ackRepair(id) {
    if (await updateReport(id, { repairAckAt: new Date().toISOString() })) toast('รับทราบแล้ว');
  }
  async function ackRepairAll() {
    const list = repairUnacked();
    if (!list.length) return;
    const now = new Date().toISOString(), u = {};
    list.forEach(r => { u['reports/' + r.id + '/repairAckAt'] = now; });
    try { await database.ref().update(u); toast('รับทราบทั้งหมดแล้ว'); }
    catch (e) {
      // บาง Rules ไม่ให้เขียนหลายใบพร้อมกัน → ทำทีละใบ
      for (const r of list) await updateReport(r.id, { repairAckAt: now });
    }
    const m = document.getElementById('repairPopup'); if (m) m.remove();
  }
  const repairPopped = new Set();
  function checkRepairPopup() {
    if (!state.isAdmin || state.page === 'report' || dashboardState.luckyDrawActive) return;
    const fresh = repairUnacked().filter(r => !repairPopped.has(r.id + '|' + r.repairRespondedAt));
    if (!fresh.length) return;
    if (userIsBusy()) { setTimeout(checkRepairPopup, 2500); return; }   // กำลังพิมพ์/เปิดหน้าต่างอื่นอยู่ → รอก่อน
    fresh.forEach(r => repairPopped.add(r.id + '|' + r.repairRespondedAt));
    const items = fresh.map(r => {
      const R = REPAIR_RESP[r.repairResponse] || REPAIR_RESP.fix_now;
      return '<div class="ur-pop-item" style="--tc:' + R.c + ';--tb:' + R.b + '"><span class="ic">' + ic(R.icon, 18) + '</span><div style="min-width:0">' +
        '<div><b class="ur-mono">' + esc(r.reportNumber) + '</b> · ' + esc(r.assignedTo || '-') + '</div>' +
        '<div style="font-weight:700;color:var(--tc)">' + esc(R.t) + '</div>' +
        '<div class="ur-hint" style="margin:0">' + esc(lineTxt(r.description, 80)) + (r.repairRespondNote ? ' — หมายเหตุ: ' + esc(r.repairRespondNote) : '') + '</div></div></div>';
    }).join('');
    openModal({ id: 'repairPopup', title: '🔔 หน่วยงานตอบรับเรื่องแจ้งซ่อม/ข้อเสนอแนะ', sub: fresh.length + ' รายการใหม่',
      body: items,
      foot: '<button class="ur-btn neutral" onclick="closeModal(\'repairPopup\')">ดูภายหลัง</button>' +
            '<button class="ur-btn" style="--tc:#0F766E" onclick="ackRepairAll()">' + ic('check', 16) + ' รับทราบ</button>' });
  }
  function openRosterPending() { rosterState.showPending = true; navigateTo('roster'); }

  // ── ตรวจความพร้อมก่อนเปลี่ยนเป็น Rules v3.0 (แสดงเฉพาะตอนที่ยังใช้ Rules ชุดเก่า) ──
  //  Rules v3.0 ตรวจ Admin จาก config/adminEmails ลำดับ 0–9 และต้องเป็นบัญชี Google ที่ยืนยันอีเมลแล้ว
  const rulesReady = { done: false, busy: false, email: '', verified: null, entries: [], err: '' };
  async function checkRulesReady() {
    if (rulesReady.busy || rulesReady.done || !state.isAdmin || !isFirebaseReady) return;
    rulesReady.busy = true;
    try {
      const u = auth.currentUser;
      rulesReady.email = (u && u.email) || '';
      rulesReady.verified = !!(u && u.emailVerified);
      const raw = (await database.ref('config/adminEmails').get()).val();
      rulesReady.entries = Array.isArray(raw) ? raw.map((v, i) => [String(i), v]).filter(e => e[1] != null)
                                              : Object.entries(raw && typeof raw === 'object' ? raw : {});
    } catch (e) { rulesReady.err = (e && e.message) || 'อ่านไม่ได้'; }
    rulesReady.busy = false;
    rulesReady.done = true;
    safeRender();
  }
  function rulesReadyHtml() {
    if (!rulesReady.done) { setTimeout(checkRulesReady, 0); return ''; }
    const E = rulesReady.entries;
    const bad = E.filter(([k, v]) => !/^[0-9]$/.test(k) || typeof v !== 'string');
    const mine = E.find(e => e[1] === rulesReady.email);
    const okV = rulesReady.verified === true, okF = E.length > 0 && !bad.length && !rulesReady.err, okM = !!mine && /^[0-9]$/.test(mine[0]);
    const row = (ok, t) => '<div style="margin-top:4px">' + (ok ? '✅ ' : '❌ ') + t + '</div>';
    return '<div class="ur-card" style="margin-bottom:14px;border-color:' + (okV && okF && okM ? '#86EFAC' : '#FCA5A5') + '">' +
      '<div class="ur-sec-t">ตรวจความพร้อมก่อนเปลี่ยน Firebase Rules v3.0</div>' +
      row(okV, 'บัญชีที่ล็อกอิน <b>' + esc(rulesReady.email || '-') + '</b> ยืนยันอีเมลกับ Google แล้ว') +
      row(okF, 'config/adminEmails เก็บเป็นลำดับ 0–9 · มี ' + E.length + ' อีเมล' + (rulesReady.err ? ' (' + esc(rulesReady.err) + ')' : '') +
        (bad.length ? ' · ลำดับที่ใช้ไม่ได้: ' + bad.map(b => esc(b[0])).join(', ') : '')) +
      row(okM, 'อีเมลนี้อยู่ในรายชื่อ Admin ลำดับที่ ' + (mine ? esc(mine[0]) : '-')) +
      '<div class="ur-hint">รายชื่อ Admin: ' + (E.map(([k, v]) => esc(k) + ' = ' + esc(String(v))).join(' · ') || '-') + '</div>' +
      '<div style="margin-top:8px;font-weight:700;color:' + (okV && okF && okM ? '#15803D' : '#B91C1C') + '">' +
        (okV && okF && okM ? 'พร้อมเปลี่ยน Rules v3.0' : 'ยังไม่ควรเปลี่ยน Rules — แก้รายการที่มี ❌ ก่อน') + '</div></div>';
  }

  async function savePerson() {
    const E = rosterState.edit;
    if (!E) return;
    const g = id => String((document.getElementById(id) || {}).value || '').trim().replace(/\s+/g, ' ');
    const data = { empId: g('pmEmp'), fullName: g('pmName'), position: g('pmPos'), department: g('pmDept') };
    const oid = g('pmOffice') || E.oid;
    const err = m => { const b = document.getElementById('personErr'); if (b) { b.textContent = m; b.style.display = 'flex'; } };
    if (!data.empId) return err('กรอกรหัสประจำตัว — ใช้เป็นรหัสที่พนักงานพิมพ์ค้นหาตอนรายงาน');
    if (!data.fullName) return err('กรอกชื่อ-นามสกุล');
    if (!OFC[oid]) return err('เลือกหน่วยงาน');
    const ix = peopleIndex();
    const dup = (ix.byEmp[data.empId] || []).filter(k => k !== E.key);
    if (dup.length) { const d = ix.byKey[dup[0]]; return err('รหัส ' + data.empId + ' ซ้ำกับ ' + d.p.fullName + ' (' + OFC[d.oid] + ')'); }
    const now = new Date().toISOString();
    const u = {};
    let key = E.key;
    if (key) {
      const old = ix.byKey[key];
      if (old && old.oid !== oid) { u['empPeople/' + old.oid + '/' + key] = null; u['empLookup/' + old.oid + '/' + key] = null; }
      u['empPeople/' + oid + '/' + key] = Object.assign({}, data, { addedAt: (old && old.p.addedAt) || now, updatedAt: now });
    } else {
      key = database.ref('empPeople/' + oid).push().key;
      u['empPeople/' + oid + '/' + key] = Object.assign({}, data, { addedAt: now });
    }
    u['empLookup/' + oid + '/' + key] = lookupOf(data);
    (E.linkIds || []).forEach(id => { u['reports/' + id + '/reporterKey'] = key; });
    modalBusy('personModal', true);
    try {
      await database.ref().update(u);
      emp.lookupAt = 0;
      modalBusy('personModal', false);
      closeModal('personModal');
      if (oid !== rosterState.oid) rosterState.oid = oid;
      toast(E.key ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่มรายชื่อแล้ว' + (E.linkIds ? ' และจับคู่รายงาน ' + E.linkIds.length + ' ใบ' : ''));
      rosterState.edit = null;
      safeRender();
    } catch (e) {
      modalBusy('personModal', false);
      err('บันทึกไม่สำเร็จ: ' + (e && e.message) + (isDenied(e) ? ' — ต้องอัปเดต Firebase Rules ชุด v3.0' : ''));
    }
  }

  // ── นำเข้า Excel (ตรวจก่อนบันทึก แบบเดียวกับระบบจัดการอุปกรณ์ฯ) ──
  const ROSTER_FIELDS = [['fullName', 'ชื่อ-นามสกุล'], ['position', 'ตำแหน่ง'], ['department', 'สังกัด'], ['empId', 'รหัสประจำตัว']];
  function handleRosterImport(input) {
    const f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    const oid = rosterState.oid;
    const rd = new FileReader();
    rd.onload = ev => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, blankrows: false });
        if (rows.length < 2) { alert('ไม่พบข้อมูลในไฟล์'); return; }
        const hd = rows[0].map(x => String(x == null ? '' : x).toLowerCase().trim());
        const col = (...ks) => { for (const k of ks) { const i = hd.findIndex(x => x.indexOf(k) >= 0); if (i >= 0) return i; } return -1; };
        const cId = col('รหัส', 'emp', 'id'), cNm = col('ชื่อ', 'name'), cPo = col('ตำแหน่ง', 'position'), cDe = col('สังกัด', 'แผนก', 'dept');
        if (cNm < 0) { alert('ไม่พบคอลัมน์ “ชื่อ-นามสกุล” ในไฟล์'); return; }
        const cell = (r, c) => c >= 0 && r && r[c] != null ? String(r[c]).trim().replace(/\s+/g, ' ') : '';
        const seen = {}, fileRows = []; let dupFile = 0;
        for (let i = 1; i < rows.length; i++) {
          const nm = cell(rows[i], cNm);
          if (!nm) continue;
          const rec = { empId: cell(rows[i], cId), fullName: nm, position: cell(rows[i], cPo), department: cell(rows[i], cDe) };
          const k = rec.empId || ('~' + nm);
          if (seen[k] !== undefined) { fileRows[seen[k]] = rec; dupFile++; continue; }
          seen[k] = fileRows.length; fileRows.push(rec);
        }
        const masked = fileRows.filter(r => /\*{2,}/.test(r.fullName)).length;
        if (masked) { alert('❌ ไฟล์นี้มีชื่อที่ถูกเซ็นเซอร์ (***) ' + masked + ' แถว\n\nกรุณาส่งออกจากระบบต้นทางแบบ “ไม่เซ็นเซอร์นามสกุล” แล้วนำเข้าใหม่'); return; }
        if (!fileRows.length) { alert('ไม่พบรายชื่อในไฟล์'); return; }
        const ix = peopleIndex();
        const cur = peopleList(oid);
        const byName = {}; cur.forEach(p => { const n = String(p.fullName || '').trim(); if (n && !byName[n]) byName[n] = p; });
        const add = [], upd = [], touched = {}; let same = 0, noId = 0;
        fileRows.forEach(rec => {
          if (!rec.empId) noId++;
          let hitKey = null, hitOid = null, hitP = null;
          const keys = rec.empId ? (ix.byEmp[rec.empId] || []) : [];
          if (keys.length) { const hh = ix.byKey[keys[0]]; hitKey = keys[0]; hitOid = hh.oid; hitP = hh.p; }
          else if (byName[rec.fullName]) { hitP = byName[rec.fullName]; hitKey = hitP.key; hitOid = oid; }
          if (!hitKey) { add.push(rec); return; }
          if (hitOid === oid) touched[hitKey] = true;
          const next = { empId: rec.empId || hitP.empId || '', fullName: rec.fullName, position: rec.position, department: rec.department };
          const diffs = ROSTER_FIELDS.filter(([k]) => String(hitP[k] || '') !== String(next[k] || '')).map(([k, l]) => ({ l: l, from: hitP[k] || '—', to: next[k] || '—' }));
          if (hitOid !== oid) diffs.push({ l: 'หน่วยงาน', from: OFC[hitOid] || hitOid, to: OFC[oid] });
          if (diffs.length) upd.push({ key: hitKey, fromOid: hitOid, name: hitP.fullName, next: next, diffs: diffs, addedAt: hitP.addedAt || '' });
          else same++;
        });
        const missing = cur.filter(p => !touched[p.key]);
        if (!add.length && !upd.length && !missing.length) { toast('ข้อมูลในไฟล์ตรงกับระบบอยู่แล้ว (' + same + ' คน)'); return; }
        rosterState.plan = { oid, add, upd, same, missing, noId, dupFile, total: fileRows.length };
        showImportPlan();
      } catch (ex) { alert('อ่านไฟล์ไม่สำเร็จ: ' + ex.message); }
    };
    rd.readAsArrayBuffer(f);
  }

    const tbl = rows => '<div class="ur-tblwrap" style="max-height:190px"><table class="ur-tbl"><tbody>' + rows + '</tbody></table></div>';
    let b = '<div class="ur-plan-grid">' + card('เพิ่มใหม่', P.add.length, '#0D8577', '#E1F4F1') + card('ข้อมูลเปลี่ยน', P.upd.length, '#C2610C', '#FDF0E2') +

    if (P.add.length) b += '<div class="ur-lbl sm" style="margin-top:12px">เพิ่มใหม่ ' + P.add.length + ' คน</div>' +

      tbl(P.upd.slice(0, 100).map(x => '<tr><td style="width:180px"><b>' + esc(x.name) + '</b></td><td>' + x.diffs.map(d =>
        '<div style="font-size:12.5px"><span class="muted">' + esc(d.l) + ': </span><s style="color:#B91C1C">' + esc(d.from) + '</s> → <b style="color:#15803D">' + esc(d.to) + '</b></div>').join('') + '</td></tr>').join(''));
    if (P.missing.length) b += '<label class="ur-check" style="margin-top:12px"><input type="checkbox" id="impDel"> ลบคนที่ไม่มีในไฟล์นี้ออกจาก ' + esc(OFC[P.oid]) + ' ' + P.missing.length + ' คน</label>' +
      tbl(P.missing.slice(0, 100).map(m => '<tr><td class="ur-mono" style="width:100px">' + esc(m.empId || '—') + '</td><td><b>' + esc(m.fullName) + '</b></td><td class="muted">' + esc(m.position || '—') + '</td></tr>').join('')) +
      '<div class="ur-hint">ถ้าไม่ติ๊ก คนกลุ่มนี้จะยังอยู่ในระบบตามเดิม · รายงานเดิมไม่ถูกลบไม่ว่ากรณีใด</div>';
    openModal({ id: 'importModal', sticky: true, wide: true, title: 'ตรวจสอบก่อนนำเข้า — ' + esc(OFC[P.oid]), sub: 'อ่านจากไฟล์ได้ ' + P.total + ' รายชื่อ', style: '--tc:#0F766E;--tb:#CCFBF1',
      body: b,
      foot: '<button class="ur-btn neutral" onclick="closeModal(\'importModal\');rosterState.plan=null">ยกเลิก</button><button class="ur-btn" onclick="runRosterImport()">ยืนยันนำเข้า</button>' });
  }
  async function runRosterImport() {
    const P = rosterState.plan;
    if (!P) return;
    const doUpd = !!(document.getElementById('impUpd') || {}).checked, doDel = !!(document.getElementById('impDel') || {}).checked;
    const u = {}, now = new Date().toISOString();
    P.add.forEach(a => {
      const k = database.ref('empPeople/' + P.oid).push().key;
      u['empPeople/' + P.oid + '/' + k] = Object.assign({}, a, { addedAt: now });
      u['empLookup/' + P.oid + '/' + k] = lookupOf(a);
    });
    if (doUpd) P.upd.forEach(x => {
      if (x.fromOid !== P.oid) { u['empPeople/' + x.fromOid + '/' + x.key] = null; u['empLookup/' + x.fromOid + '/' + x.key] = null; }
      u['empPeople/' + P.oid + '/' + x.key] = Object.assign({}, x.next, { addedAt: x.addedAt || now, updatedAt: now });
      u['empLookup/' + P.oid + '/' + x.key] = lookupOf(x.next);
    });
    if (doDel) P.missing.forEach(m => { u['empPeople/' + P.oid + '/' + m.key] = null; u['empLookup/' + P.oid + '/' + m.key] = null; });
    if (!Object.keys(u).length) { closeModal('importModal'); rosterState.plan = null; return; }
    modalBusy('importModal', true);
    try {
      await database.ref().update(u);
      emp.lookupAt = 0;
      modalBusy('importModal', false);
      closeModal('importModal');
      const parts = [];
      if (P.add.length) parts.push('เพิ่ม ' + P.add.length);
      if (doUpd && P.upd.length) parts.push('อัปเดต ' + P.upd.length);
      if (doDel && P.missing.length) parts.push('ลบ ' + P.missing.length);
      toast('นำเข้าเรียบร้อย · ' + (parts.join(' · ') || 'ไม่มีการเปลี่ยนแปลง'));
      rosterState.plan = null;
    } catch (e) {
      modalBusy('importModal', false);
      alert('❌ บันทึกไม่สำเร็จ: ' + (e && e.message) + (isDenied(e) ? '\n\nต้องอัปเดต Firebase Rules ชุด v3.0 ก่อน' : ''));
    }
  }
  function rosterRows(list) {
    return list.map((p, i) => ({ 'ลำดับ': i + 1, 'รหัสประจำตัว': p.empId || '', 'ชื่อ-นามสกุล': rosterState.censor ? censorName(p.fullName) : (p.fullName || ''),

  }

  // ================== สรุปสถานะจำนวนการรายงาน (รายบุคคล แยกหน่วยงาน) ==================
  // นับเฉพาะ Unsafe Action / Unsafe Condition / Near Miss ที่ จป. รับเรื่องแล้ว — ไม่นับแจ้งซ่อม ไม่นับผู้ไม่ประสงค์ออกนาม
  // (ใช้ต่อยอดระบบคะแนนความปลอดภัย: Unsafe Report + % Safety Talk + WeSafe)
  const TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  const summaryState = { oid: 'lamphun', mode: 'month', day: '', month: 0, year: 0, q: '', onlyActive: false };
  (function () { const d = new Date(); summaryState.day = localDateStr(d); summaryState.month = d.getMonth(); summaryState.year = d.getFullYear(); })();

  function summaryRange() {
    const s = summaryState;
    if (s.mode === 'day') { const a = new Date(s.day + 'T00:00:00'); if (isNaN(a)) return null; const b = new Date(a); b.setDate(b.getDate() + 1); return { a, b, label: fmtDate(a) }; }
    if (s.mode === 'month') return { a: new Date(s.year, s.month, 1), b: new Date(s.year, s.month + 1, 1), label: TH_MONTHS[s.month] + ' ' + (s.year + 543) };
    if (s.mode === 'year') return { a: new Date(s.year, 0, 1), b: new Date(s.year + 1, 0, 1), label: 'ปี ' + (s.year + 543) };
    return null;
  }
  function summaryCounts() {
    const rng = summaryRange(), m = {};
    state.reports.forEach(r => {
      if (!isAcceptedSafety(r)) return;
      if (rng) { const d = new Date(r.createdAt || 0); if (!(d >= rng.a && d < rng.b)) return; }
      const who = identityOf(r);
      if (!who) return;
      const x = m[who.id] || (m[who.id] = { who: who, UA: 0, UC: 0, NM: 0, total: 0 });
      x[typeOf(r)]++; x.total++;
    });
    return m;
  }
  // แถวของหน่วยงาน: ทุกคนในทะเบียน (เรียงแบบระบบจัดการอุปกรณ์ฯ) + คนกรอกชื่อเองที่ระบุหน่วยงานนี้
  function summaryRows(oid, C) {
    const rows = sortPersonnel(peopleList(oid)).map(p => {
      const x = C['emp:' + p.key] || { UA: 0, UC: 0, NM: 0, total: 0 };
      return { key: p.key, empId: p.empId || '', name: p.fullName || '-', position: p.position || '', department: p.department || '', UA: x.UA, UC: x.UC, NM: x.NM, total: x.total, inReg: true };
    });
    Object.values(C).forEach(x => {
      if (x.who.inRegistry) return;
      const o = x.who.oid && OFC[x.who.oid] ? x.who.oid : 'other';
      if (o !== oid) return;
      rows.push({ key: '', empId: x.who.empId || '', name: x.who.name, position: x.who.position || '', department: x.who.department || x.who.unit || '',
                  UA: x.UA, UC: x.UC, NM: x.NM, total: x.total, inReg: false });
    });
    return rows;
  }
  function summaryOverview(C) {
    const tabs = OFFICES.map(o => o.id);
    if (Object.values(C).some(x => !x.who.inRegistry && !(x.who.oid && OFC[x.who.oid]))) tabs.push('other');
    return tabs.map(oid => {
      const rows = summaryRows(oid, C);
      const reg = rows.filter(r => r.inReg).length, active = rows.filter(r => r.total > 0).length, activeReg = rows.filter(r => r.inReg && r.total > 0).length;
      const t = k => rows.reduce((s, r) => s + r[k], 0);
      return { oid, name: oid === 'other' ? 'อื่นๆ / ภายนอก' : OFC[oid], reg, active, pct: reg ? Math.round(activeReg * 100 / reg) : null, UA: t('UA'), UC: t('UC'), NM: t('NM'), total: t('total') };
    });
  }

  function summaryTableHtml(rows) {

    if (summaryState.onlyActive) list = list.filter(r => r.total > 0);
    if (!list.length) return '<div class="ur-empty">' + ic('users', 28) + '<div>' + (rows.length ? 'ไม่พบรายชื่อตามเงื่อนไข' : 'ยังไม่มีรายชื่อในหน่วยงานนี้ — เพิ่มได้ที่เมนู “จัดการรายชื่อ”') + '</div></div>';
    const n = v => '<td class="num' + (v ? '' : ' zero') + '">' + v + '</td>';
    return '<div class="ur-tblwrap" style="max-height:66vh"><table class="ur-tbl"><thead><tr><th class="c" style="width:44px">#</th><th style="width:96px">รหัส</th><th>ชื่อ-นามสกุล</th>' +

      list.map((r, i) => '<tr><td class="num" style="color:#9CA3AF">' + (i + 1) + '</td><td class="ur-mono" style="font-size:12.5px">' + esc(r.empId || '-') + '</td>' +
        '<td><b>' + esc(r.name) + '</b>' + (r.inReg ? '' : ' <span class="ur-chip sm warn">ไม่อยู่ในทะเบียน</span>') + '</td>' +

      '</tbody></table></div><div class="ur-hint">แสดง ' + list.length + ' คน</div>';
  }
  function summarySearch(v) {
    summaryState.q = String(v || '');

    if (box) box.innerHTML = summaryTableHtml(summaryRows(summaryState.oid, summaryCounts()));
  }

      '</div>' +

    return h + '</div></div>';
  }

  // ================== หัวหน้าหน่วยงาน: รายการของหน่วยงาน ==================
  const UNIT_TODO = {
    UA: 'พิมพ์ใบแจ้งเตือนให้ผู้ปฏิบัติงานลงนาม แล้วแนบรูปใบที่ลงนามกลับเข้าระบบ',
    UC: 'แก้ไขสภาพการณ์ให้ปลอดภัย แล้วแนบรูปหลังการแก้ไข (ไม่ต้องมีใบแจ้งเตือน)',
    NM: 'พิมพ์ใบแจ้งเตือน และ/หรือ แก้ไขให้ปลอดภัย — แนบใบที่ลงนาม หรือรูปหลังการแก้ไข อย่างใดอย่างหนึ่งหรือทั้งสองอย่าง',

  };
  function renderUnitDetail() {
    const unit = RESPONSIBLE_UNITS.find(u => u.id === state.selectedUnitId);
    if (!unit) return '<div class="ur-page">' + topBar('ไม่พบหน่วยงาน', '', "navigateTo('tracking')") + '</div>';
    const assigned = unitWaiting(unit.name);
    const doneAll = state.reports.filter(r => (r.status === 'resolved' || r.status === 'approved') && r.assignedTo === unit.name);
    const done = filterReportsByDate(doneAll, dashboardState.unitFilterPeriod, dashboardState.unitFilterStartDate, dashboardState.unitFilterEndDate);
    const P = dashboardState.unitFilterPeriod || 'year';
    const opt = (v, l) => '<option value="' + v + '"' + (P === v ? ' selected' : '') + '>' + l + '</option>';

    let h = '<div class="ur-page ur-c-orange">' + topBar(esc(unit.name), 'รายการที่ได้รับมอบหมาย', "navigateTo('tracking')") + '<div class="ur-body">';
    h += '<div class="ur-stats" style="margin-bottom:16px">' +
      '<div class="ur-stat" style="--tc:#EA580C"><div class="ur-stat-l">รอดำเนินการ</div><div class="ur-stat-v">' + assigned.length + '</div></div>' +
      '<div class="ur-stat" style="--tc:#059669"><div class="ur-stat-l">แก้ไขแล้ว (ตามช่วงเวลา)</div><div class="ur-stat-v">' + done.length + '</div>' +
        '<select id="unitPeriodFilter" class="ur-inp" style="padding:6px 8px;margin-top:6px" onchange="handleUnitPeriodChange(this.value)">' +
          opt('today', 'วันนี้') + opt('week', '7 วันล่าสุด') + opt('month', 'เดือนนี้') + opt('year', 'ปีนี้') + opt('all', 'ทั้งหมด') + opt('custom', 'กำหนดเอง') + '</select>' +
        '<div id="unitCustomDateRange" style="display:' + (P === 'custom' ? 'block' : 'none') + ';margin-top:6px">' +
          '<input type="date" id="unitStartDate" class="ur-inp" style="padding:5px 8px;margin-bottom:4px" value="' + esc(dashboardState.unitFilterStartDate || '') + '">' +
          '<input type="date" id="unitEndDate" class="ur-inp" style="padding:5px 8px;margin-bottom:4px" value="' + esc(dashboardState.unitFilterEndDate || '') + '">' +
          '<button class="ur-btn xs block" style="--tc:#059669" onclick="applyUnitCustomFilter()">ค้นหา</button></div></div>' +
      '</div>';

    h += '<section class="ur-section"><h2 class="ur-h2">' + ic('clipboard', 21) + ' รายการที่ต้องดำเนินการ <span class="ur-count">' + assigned.length + '</span></h2>';
    h += assigned.length ? assigned.map(unitCard).join('') : '<div class="ur-empty">' + ic('shieldok', 30) + '<div>ไม่มีรายการที่ต้องดำเนินการ</div></div>';
    h += '</section>';

    if (done.length) {
      h += '<section class="ur-section"><h2 class="ur-h2" style="color:#047857">' + ic('check', 21) + ' รายการแก้ไขแล้ว <span class="ur-count">' + done.length + '</span></h2>' +
        done.map(r => '<article class="ur-card ur-rcard" style="' + typeVars(typeOf(r)) + ';padding:14px">' +
          reportHead(r) +
          '<div class="ur-rmeta"><div>วันที่พบเหตุการณ์: ' + esc(fmtDate(r.incidentDate)) + ' · แนบรูปเมื่อ ' + esc(fmtDT(r.resolvedAt)) +
            (r.status === 'approved' ? ' · อนุมัติเมื่อ ' + esc(fmtDT(r.approvedAt)) : '') + '</div></div>' +
          subjectHtml(r, 'ur-subject') + repairRespHtml(r) + resolveGroupsHtml(r) +
          (state.isAdmin ? '<div style="text-align:right;margin-top:8px"><button class="ur-btn danger xs" onclick="showDeleteModal(' + ja(r.id) + ')">' + ic('trash', 13) + ' ลบรายงาน (Admin)</button></div>' : '') +
        '</article>').join('') + '</section>';
    }
    return h + '</div></div>';
  }

      actions = '<div class="ur-rp-ask"><div class="ur-rp-ask-t">' + ic('wrench', 17) + ' แจ้งซ่อม/แจ้งข้อเสนอแนะปรับปรุง — กรุณาเลือกการดำเนินการ</div>' +

      actions = '<div class="ur-assign-btns">' +
        (S.print ? '<button class="ur-btn" style="--tc:#2563EB;--tg:rgba(37,99,235,.35);flex:1" onclick="printWarningLetter(' + ja(r.id) + ')">' + ic('print', 16) + ' พิมพ์ใบแจ้งเตือน</button>' : '') +
        '<button class="ur-btn" style="--tc:#059669;--tg:rgba(5,150,105,.35);flex:1" onclick="showResolveModal(' + ja(r.id) + ')">' + ic('camera', 16) + ' ' + label + '</button></div>';
    }
    return '<article class="ur-card ur-rcard" style="' + typeVars(t) + (r.returnReason ? ';border-color:#FDBA74;background:#FFFBF5' : '') + '">' +
      reportHead(r, r.revisionCount ? '<span class="ur-chip sm warn">ตีกลับแล้ว ' + esc(r.revisionCount) + ' ครั้ง</span>' : '') +
      '<div class="ur-rmeta"><div>' + ic('alert', 14) + ' วันที่พบเหตุการณ์: <b>' + esc(fmtDate(r.incidentDate)) + '</b> · มอบหมายเมื่อ ' + esc(fmtDT(r.assignedAt)) + '</div></div>' +
      (r.returnReason ? '<div class="ur-msg w" style="display:block"><b>⚠️ จป.วิชาชีพ ตีกลับ — ต้องแนบรูปใหม่</b><br>เหตุผล: ' + esc(r.returnReason) + '</div>' : '') +
      historyHtml(r) +
      subjectHtml(r, 'ur-subject') +
      '<div class="ur-desc">' + esc(r.description || '-') + '</div>' +
      (imgs.length ? '<div class="ur-attach"><div class="ur-attach-t">' + ic('camera', 15) + ' รูปภาพประกอบ <span class="ur-mono">(' + imgs.length + ')</span></div>' + thumbsHtml(imgs, 'รูปประกอบ') + '</div>' : '') +
      repairRespHtml(r) +
      '<div class="ur-todo">' + ic('info', 15) + '<div><b>สิ่งที่ต้องทำ:</b> ' + esc(UNIT_TODO[t]) + '</div></div>' +
      actions +
      (state.isAdmin ? '<div style="text-align:right;margin-top:10px"><button class="ur-btn danger xs" onclick="showDeleteModal(' + ja(r.id) + ')">' + ic('trash', 13) + ' ลบรายงาน (Admin)</button></div>' : '') +
    '</article>';
  }

  // ── แจ้งซ่อม: หัวหน้าหน่วยงานตอบรับ → แจ้ง จป. ──
  let respondTarget = null;
  function respondRepair(reportId, kind) {
    const r = state.reports.find(x => x.id === reportId);
    const R = REPAIR_RESP[kind];
    if (!r || !R) return;
    respondTarget = { id: reportId, kind: kind };
    openModal({ id: 'respondModal', sticky: true, title: esc(R.t), sub: 'เลขที่ ' + esc(r.reportNumber || '-') + ' · ' + esc(r.location || ''),
      style: '--tc:' + R.c + ';--tb:' + R.b,
      body: '<div class="ur-msg i">' + ic('send', 16) + '<div>ระบบจะแจ้ง จป.วิชาชีพ ทาง LINE ทันทีว่าหน่วยงานเลือก <b>“' + esc(R.t) + '”</b></div></div>' +
        '<label class="ur-lbl sm" for="respondNote">หมายเหตุถึง จป.วิชาชีพ <small>(ถ้ามี)</small></label>' +
        '<textarea id="respondNote" class="ur-inp" rows="3" maxlength="300" placeholder="' +
          (kind === 'fix_now' ? 'เช่น คาดว่าแก้ไขเสร็จภายในวันที่...' : 'เช่น ต้องใช้งบประมาณ จะนำเข้าที่ประชุมผู้บริหารวันที่...') + '"></textarea>' +
        '<p class="ur-hint">ขั้นต่อไป: เมื่อแก้ไขเสร็จ กด “แนบรูปหลังการแก้ไข / ปิดงาน”</p>',
      foot: '<button class="ur-btn neutral" onclick="closeModal(\'respondModal\')">ยกเลิก</button>' +
            '<button class="ur-btn" onclick="confirmRespond()">' + ic('check', 16) + ' ยืนยัน</button>' });
  }
  async function confirmRespond() {
    if (!respondTarget) return;
    const r = state.reports.find(x => x.id === respondTarget.id);
    if (!r) { closeModal('respondModal'); return; }
    const note = (document.getElementById('respondNote') || {}).value || '';
    const updates = { repairResponse: respondTarget.kind, repairRespondedAt: new Date().toISOString(), repairRespondNote: note.trim(), repairAckAt: null };
    modalBusy('respondModal', true);
    const ok = await updateReport(r.id, updates);
    modalBusy('respondModal', false);
    if (!ok) return;
    closeModal('respondModal');
    let sent = false;
    try { sent = await notifyAdminRepairResponse(Object.assign({}, r, updates)); } catch (e) { console.warn(e); }
    alert('✅ บันทึกการตอบรับแล้ว: ' + REPAIR_RESP[updates.repairResponse].t + '\n\n' +
          (sent ? '📤 แจ้ง จป.วิชาชีพ ทาง LINE แล้ว' : 'ℹ️ บันทึกในระบบแล้ว (จป.วิชาชีพ จะเห็นแจ้งเตือนในหน้า Admin)') +
          '\n\nเมื่อแก้ไขเสร็จ กรุณาแนบรูปหลังการแก้ไขเพื่อปิดงาน');
    respondTarget = null;
  }

  // ================== แนบรูปปิดงาน (แยกช่องตามประเภท) ==================
  const rs = { id: null, slots: {}, busy: 0 };
  function showResolveModal(reportId) {
    const r = state.reports.find(x => x.id === reportId);
    if (!r) return;
    const t = typeOf(r), S = RESOLVE_SPEC[t];
    if (t === 'RP' && !r.repairResponse) { alert('กรุณาเลือกการดำเนินการ (ดำเนินการได้ทันที / ขอหารือผู้บริหารก่อน) ก่อนแนบรูป'); return; }
    rs.id = reportId; rs.slots = {}; rs.busy = 0;
    S.slots.forEach(s => { rs.slots[s.k] = []; });
    const guide = {
      UA: 'แนบรูปใบแจ้งเตือนที่ผู้ปฏิบัติงานลงนามแล้ว (หรือรูปการแก้ไข) อย่างน้อย 1 รูป',
      UC: 'แนบรูปหลังการแก้ไขสภาพการณ์ อย่างน้อย 1 รูป',
      NM: 'แนบได้ทั้งสองช่อง หรือช่องใดช่องหนึ่ง (อย่างน้อย 1 รูป) — แล้วแต่กรณี',
      RP: 'แนบรูปหลังการแก้ไข/ปรับปรุง อย่างน้อย 1 รูป'
    }[t];
    openModal({ id: 'resolveModal', sticky: true, title: '✅ แนบหลักฐานการแก้ไข / ขอปิดงาน', sub: 'เลขที่ ' + esc(r.reportNumber || '-') + ' · ' + esc(typeLabel(t)),
      style: typeVars(t),
      body: '<div class="ur-msg i">' + ic('info', 16) + '<div>' + esc(guide) + ' · ช่องละไม่เกิน ' + RESOLVE_MAX + ' รูป</div></div>' +
        S.slots.map(s => '<div class="ur-field"><div class="ur-lbl">' + ic(s.k === 'fix' ? 'wrench' : 'file', 16) + ' ' + esc(s.t) + '</div>' +
          '<label class="ur-drop" for="rs_' + s.k + '">' + ic('camera', 24) + '<b>แตะเพื่อถ่ายรูป หรือเลือกจากคลังภาพ</b></label>' +
          '<input type="file" id="rs_' + s.k + '" class="ur-file" accept="image/*" multiple onchange="handleResolveFiles(\'' + s.k + '\', this)">' +
          '<div id="rsThumbs_' + s.k + '"></div><div id="rsStat_' + s.k + '" class="ur-hint"></div></div>').join('') +
        '<div class="ur-field"><label class="ur-lbl" for="resolveNote">หมายเหตุ <small>(ถ้ามี)</small></label>' +
        '<textarea id="resolveNote" class="ur-inp" rows="3" maxlength="500" placeholder="ระบุรายละเอียดการแก้ไข..."></textarea></div>',
      foot: '<button class="ur-btn neutral" onclick="closeResolveModal()">ยกเลิก</button>' +
            '<button class="ur-btn" id="resolveSubmit" style="--tc:#059669" onclick="confirmResolve()">' + ic('send', 16) + ' ส่งให้ จป. อนุมัติปิดงาน</button>' });
  }
  function closeResolveModal() {
    if (rs.busy && !confirm('รูปกำลังอัปโหลดอยู่ ต้องการยกเลิกหรือไม่?')) return;
    const m = document.getElementById('resolveModal');
    if (m) { delete m.dataset.busy; m.remove(); }
    rs.id = null; rs.slots = {}; rs.busy = 0;
  }
  function rsRenderSlot(k) {
    const box = document.getElementById('rsThumbs_' + k);
    if (!box) return;
    const arr = rs.slots[k] || [];
    box.innerHTML = arr.length ? '<div class="ur-thumbs">' + arr.map((u, i) =>
      '<div class="ur-thumb"><img src="' + esc(u) + '" alt="รูปที่ ' + (i + 1) + '"><button type="button" title="เอารูปนี้ออก" onclick="rsRemove(\'' + k + '\',' + i + ')">' + ic('x', 14) + '</button></div>').join('') + '</div>' : '';
  }
  function rsRemove(k, i) { (rs.slots[k] || []).splice(i, 1); rsRenderSlot(k); }
  function rsLock() {
    const b = document.getElementById('resolveSubmit');
    if (b) { b.disabled = rs.busy > 0; }
  }
  async function handleResolveFiles(k, input) {
    const room = RESOLVE_MAX - (rs.slots[k] || []).length;
    const files = Array.from(input.files || []).slice(0, Math.max(0, room));
    input.value = '';
    const stat = document.getElementById('rsStat_' + k);
    if (!files.length) { if (room <= 0 && stat) stat.textContent = 'ครบ ' + RESOLVE_MAX + ' รูปแล้ว — เอารูปเดิมออกก่อนถ้าต้องการเปลี่ยน'; return; }
    const id = rs.id;
    rs.busy++; rsLock();
    const errors = [];
    for (let i = 0; i < files.length; i++) {
      if (stat) stat.textContent = '📤 กำลังอัปโหลดรูปที่ ' + (i + 1) + '/' + files.length + '…';
      try {
        const url = await uploadImageWithFallback(await compressImage(files[i], 1200, 0.8));
        if (rs.id !== id) break;                       // ปิดหน้าต่างไปแล้ว
        if (url && safeUrl(url)) { rs.slots[k].push(url); rsRenderSlot(k); }
        else errors.push('รูปที่ ' + (i + 1) + ' อัปโหลดไม่สำเร็จ' + (lastUploadInfo.errors.length ? ' (' + lastUploadInfo.errors.join(' / ') + ')' : ''));
      } catch (e) {
        errors.push('รูปที่ ' + (i + 1) + ': ' + ((e && e.message) || 'เกิดข้อผิดพลาด'));
      }
    }
    rs.busy = Math.max(0, rs.busy - 1); rsLock();
    if (stat) stat.textContent = errors.length ? '⚠️ ' + errors.join(' · ') : (rs.slots[k] && rs.slots[k].length ? '✅ อัปโหลดแล้ว ' + rs.slots[k].length + ' รูป' : '');
  }
  async function confirmResolve() {
    if (rs.busy) { alert('⏳ รูปกำลังอัปโหลด กรุณารอสักครู่'); return; }
    const r = state.reports.find(x => x.id === rs.id);
    if (!r) { closeResolveModal(); return; }
    const t = typeOf(r);
    const L = (rs.slots.letter || []).slice(), F = (rs.slots.fix || []).slice();
    if (t === 'UA' && !L.length) { alert('❌ กรุณาแนบรูปใบแจ้งเตือนที่ลงนามแล้ว อย่างน้อย 1 รูป'); return; }
    if ((t === 'UC' || t === 'RP') && !F.length) { alert('❌ กรุณาแนบรูปหลังการแก้ไข อย่างน้อย 1 รูป'); return; }
    if (t === 'NM' && !L.length && !F.length) { alert('❌ กรุณาแนบใบแจ้งเตือนที่ลงนาม หรือรูปหลังการแก้ไข อย่างน้อย 1 รูป'); return; }
    if (!confirm('ยืนยันส่งหลักฐานการแก้ไข?\n\nรายงานเลขที่: ' + r.reportNumber + '\n\nจะส่งไปให้ จป.วิชาชีพ อนุมัติปิดงาน')) return;
    const updates = {
      status: 'resolved',
      resolveLetterImages: L.length ? L : null,
      resolveFixImages: F.length ? F : null,
      resolveImages: L.concat(F),                  // ชุดรวม (ให้หน้าจอ/ระบบเดิมอ่านได้)
      resolveNote: ((document.getElementById('resolveNote') || {}).value || '').trim(),
      resolvedAt: new Date().toISOString()
    };
    modalBusy('resolveModal', true);
    const ok = await updateReport(r.id, updates);
    modalBusy('resolveModal', false);
    if (!ok) return;
    rs.busy = 0;
    closeResolveModal();
    notifyAdminPendingApproval(Object.assign({}, r, updates)).then(s => console.log('📤 Admin approval notification:', s ? 'sent' : 'no admin registered')).catch(e => console.warn(e));
    alert('✅ ส่งหลักฐานการแก้ไขเรียบร้อย!\n\nรายงานเลขที่: ' + r.reportNumber + '\n\nรอ จป.วิชาชีพ อนุมัติปิดงาน');
  }
  
  // ================== Dashboard ==================
  function dashboardFiltered() {
    const base = filterReportsByDate(state.reports, dashboardState.filterPeriod, dashboardState.filterStartDate, dashboardState.filterEndDate);
    let list = base;
    const tf = dashboardState.typeFilter || 'all';
    if (tf !== 'all') list = list.filter(r => typeOf(r) === tf);
    const q = (dashboardState.searchQuery || '').trim().toLowerCase();
    if (q) list = list.filter(r => [r.reportNumber, r.workerName, r.workerUnit, r.victimName, r.location, r.description, r.assignedTo, r.respUnitName]
      .some(v => String(v == null ? '' : v).toLowerCase().indexOf(q) >= 0));
    return { list: list, base: base };
  }
  function setDashType(t) {
    dashboardState.typeFilter = t;
    dashboardState.currentPage = 1;
    render();
  }

  function renderDashboard() {
    const F = dashboardFiltered(), list = F.list;
    const total = list.length;
    const cnt = s => list.filter(r => r.status === s).length;
    const P = dashboardState.filterPeriod || 'all', TF = dashboardState.typeFilter || 'all';
    const q = dashboardState.searchQuery || '';
    const opt = (v, l) => '<option value="' + v + '"' + (P === v ? ' selected' : '') + '>' + l + '</option>';
    const segBtn = (k, label) => '<button class="' + (TF === k ? 'on' : '') + '" onclick="setDashType(\'' + k + '\')">' + label +
      ' <span class="ur-mono" style="opacity:.75">' + (k === 'all' ? F.base.length : F.base.filter(r => typeOf(r) === k).length) + '</span></button>';
    const chart3 = (TF === 'all' || TF === 'UA') ? 'worker' : 'place';

  // กราฟผู้ถูกรายงานบ่อย — นับเฉพาะ Unsafe Action (ประเภทอื่นไม่มี “ผู้กระทำ”)
  function createWorkerChart(reports, canvasId) {
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    if (dashboardState.chartInstances[canvasId]) dashboardState.chartInstances[canvasId].destroy();
    const m = {};
    reports.filter(r => typeOf(r) === 'UA' && r.status !== 'rejected').forEach(r => {
      const w = String(r.workerName || '').trim() || 'ไม่ระบุชื่อ';
      m[w] = (m[w] || 0) + 1;
    });
    const top = Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 10);
    dashboardState.chartInstances[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: { labels: top.map(x => x[0]), datasets: [{ label: 'จำนวนครั้ง', data: top.map(x => x[1]), backgroundColor: '#EF4444', borderRadius: 3, barPercentage: 0.75, categoryPercentage: 0.85 }] },
      options: horizontalBarOptions('Top 10 ผู้ถูกรายงานบ่อย (Unsafe Action)')
    });
  }
  function createPlaceChart(reports, canvasId) {
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    if (dashboardState.chartInstances[canvasId]) dashboardState.chartInstances[canvasId].destroy();
    const m = {};
    reports.filter(r => r.status !== 'rejected').forEach(r => {
      const w = String(r.location || '').trim();
      if (w) m[w] = (m[w] || 0) + 1;
    });
    const top = Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 10);
    dashboardState.chartInstances[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: { labels: top.map(x => x[0]), datasets: [{ label: 'จำนวนครั้ง', data: top.map(x => x[1]), backgroundColor: '#0D9488', borderRadius: 3, barPercentage: 0.75, categoryPercentage: 0.85 }] },

  }

  // Export รายการรายงาน (หน้าสาธารณะ — ไม่มีข้อมูลผู้รายงาน)
  function exportToExcel(reports, filename) {
    const data = reports.map(r => {
      const t = typeOf(r), o = {
        'เลขที่รายงาน': r.reportNumber || '',
        'ประเภท': typeLabel(t),
        'วันที่พบเหตุการณ์': r.incidentDate ? new Date(r.incidentDate).toLocaleDateString('th-TH') : ''
      };
      if (state.isAdmin) {
        o['วันที่รายงาน'] = r.createdAt ? new Date(r.createdAt).toLocaleString('th-TH') : '';
        o['ผู้รายงาน'] = reporterDisplay(r);
      }
      Object.assign(o, {
        'ผู้ถูกรายงาน/ผู้ประสบเหตุ': t === 'UA' ? (r.workerName || '') : t === 'NM' ? (r.victimName || '') : '',
        'ชุดงาน/หน่วยงานผู้ถูกรายงาน': t === 'UA' ? (r.workerUnit || '') : '',
        'พื้นที่/สถานที่': r.location || '',
        'รายละเอียด': r.description || '',
        'สถานะ': STATUS_TEXT[r.status] || '',
        'มอบหมายให้': r.assignedTo || '',
        'วันที่มอบหมาย': r.assignedAt ? new Date(r.assignedAt).toLocaleString('th-TH') : '',
        'การตอบรับ (แจ้งซ่อม)': t === 'RP' && r.repairResponse ? (REPAIR_RESP[r.repairResponse] || {}).t || '' : '',
        'วันที่แนบรูปแก้ไข': r.resolvedAt ? new Date(r.resolvedAt).toLocaleString('th-TH') : '',
        'วันที่อนุมัติ': r.approvedAt ? new Date(r.approvedAt).toLocaleString('th-TH') : '',
        'เหตุผลที่ไม่รับ': r.status === 'rejected' ? (r.rejectedReason || '') : ''
      });
      return o;
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(data);
    ws['!cols'] = Object.keys(data[0] || {}).map(k => ({ wch: k === 'รายละเอียด' ? 44 : k === 'ประเภท' ? 30 : 20 }));
    XLSX.utils.book_append_sheet(wb, ws, 'รายงาน');
    XLSX.writeFile(wb, filename || 'unsafe-report.xlsx');
  }

  // ================== การนำทาง + ปุ่มย้อนกลับของเครื่อง ==================
  function navUrl() {
    const q = new URLSearchParams();
    const p = state.page;
    if (p !== 'home') q.set('page', p === 'unit' ? 'tracking' : p);
    if (p === 'report') q.set('type', state.reportType);
    const s = q.toString();
    return location.pathname + (s ? '?' + s : '');
  }
  function navState() { return { page: state.page, reportType: state.reportType || '', unitId: state.selectedUnitId || null }; }
  function pushNav() { try { history.pushState(navState(), '', navUrl()); } catch (e) { /* บางเบราว์เซอร์ในแอปไม่รองรับ */ } }
  function replaceNav() { try { history.replaceState(navState(), '', navUrl()); } catch (e) { } }

  function closeAllModals() {
    document.querySelectorAll('.ur-modal').forEach(m => m.remove());
    document.querySelectorAll('.modal.active, .image-modal.active').forEach(m => m.classList.remove('active'));
    ['lineUserModal', 'imageDownloadModal', 'extBrowserModal'].forEach(id => { const el = document.getElementById(id); if (el) el.remove(); });
    document.body.style.overflow = '';
  }
  const LEAVE_MSG = 'ข้อมูลที่กรอกไว้ยังไม่ได้ส่ง\nต้องการออกจากหน้านี้หรือไม่?';

  function navigateTo(page, opt) {
    opt = opt || {};
    if (!opt.force && state.page === 'report' && page !== 'report' && rpFormDirty() && !confirm(LEAVE_MSG)) return false;
    closeAllModals();
    state.page = page;
    state.formData = {};
    uploadedImages = [];   // ล้างรูปค้าง กันรูปใบงานเดิมติดไปกับใบงานใหม่
    if (page === 'report') rpReset();
    if (!opt.noPush) pushNav();
    render();
    window.scrollTo(0, 0);
    return true;
  }

  window.addEventListener('popstate', function (e) {
    const s = e.state;
    if (!s || !s.page) return;
    // มีหน้าต่างย่อยเปิดอยู่ → ปุ่มย้อนกลับ = ปิดหน้าต่าง แล้วอยู่หน้าเดิม
    const busy = document.querySelector('.ur-modal[data-busy]');
    if (busy || document.querySelector('.ur-modal, .modal.active, .image-modal.active, #imageDownloadModal, #extBrowserModal')) {
      if (!busy) closeAllModals();
      pushNav();
      return;
    }
    if (dashboardState.luckyDrawActive) {               // กำลังจับรางวัล → ปิดวงล้อ อยู่หน้าเดิม
      if (dashboardState.luckyDrawSpinning) { pushNav(); return; }
      dashboardState.luckyDrawActive = false; pushNav(); render(); return;
    }
    if (state.page === 'report' && s.page !== 'report' && rpFormDirty() && !confirm(LEAVE_MSG)) { pushNav(); return; }
    closeAllModals();
    state.page = s.page;
    if (s.reportType && REPORT_TYPES[s.reportType]) state.reportType = s.reportType;
    if (s.page === 'unit') {
      if (s.unitId && (unitAuthed() || state.isAdmin)) state.selectedUnitId = s.unitId;
      else state.page = 'tracking';
    }
    state.formData = {};
    uploadedImages = [];
    if (state.page === 'report') rpReset();
    render();
    window.scrollTo(0, 0);
  });

  // ── สิทธิ์ผู้ดูแลระบบ ──
  async function isAdminEmail(email) {
    if (!email) return false;
    let snap;
    try { snap = await database.ref('config/adminEmails').get(); }
    catch (e) { if (isDenied(e)) return false; throw e; }      // Rules v3.0: คนที่ไม่ใช่ Admin อ่านรายชื่อ Admin ไม่ได้
    const v = snap.exists() ? snap.val() : null;
    const list = Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []);
    return list.indexOf(email) >= 0;
  }
  // ตรวจ whitelist แล้วเข้าสู่หน้า Admin
  async function handleAdminLoginResult(user) {
    if (!user || !user.email) return false;
    const email = user.email;
    try {
      if (await isAdminEmail(email)) {
        state.isAdmin = true;
        state.adminUser = user;
        authReady = true;
        closePasswordModal();
        startAdminListeners();
        if (ADMIN_PAGES.indexOf(state.page) < 0) navigateTo('admin');
        else render();
        return true;
      }
      await auth.signOut();
      alert('❌ "' + email + '" ไม่มีสิทธิ์เข้าถึงระบบแอดมิน');
      return false;
    } catch (e) {
      console.error('ตรวจสอบสิทธิ์ล้มเหลว:', e);
      alert('ไม่สามารถตรวจสอบสิทธิ์ได้:\n' + (e.message || ''));
      return false;
    }
  }
  // ตรวจสิทธิ์ Admin แบบสด — ไม่พึ่ง state เพียงอย่างเดียว
  async function verifyAdminLive() {
    if (state.isAdmin) return true;
    if (!isFirebaseReady || !auth) return false;
    const user = auth.currentUser;
    if (!user || !user.email) return false;
    try {
      if (await isAdminEmail(user.email)) {
        state.isAdmin = true; state.adminUser = user; startAdminListeners();
        return true;
      }
      return false;
    } catch (e) {
      console.error('❌ อ่าน config/adminEmails ไม่ได้:', e);
      return false;
    }
  }

  function unitAuthed() { try { return sessionStorage.getItem('urUnitOK') === '1'; } catch (e) { return false; } }
  async function selectUnit(unitId) {
    if (!RESPONSIBLE_UNITS.find(u => u.id === unitId)) return;

      const password = prompt('🔐 กรุณาใส่รหัสผ่านเพื่อเข้าดูข้อมูลหน่วยงาน:');
      if (password === null) return;
      if (!password.trim()) { alert('❌ กรุณาใส่รหัสผ่าน'); return; }
      try {
        if (!(await verifyUnitPassword(password))) {
          alert('❌ รหัสผ่านไม่ถูกต้อง!\n\nกรุณาติดต่อ จป.วิชาชีพ เพื่อขอรหัสผ่าน');

        return;

    }

    navigateTo('unit');

  // ตรวจว่าอยู่ใน in-app browser หรือไม่ (LINE, Facebook, IG ฯลฯ)
  function isInAppBrowser() {
    const ua = navigator.userAgent || navigator.vendor || '';
    return /Line\//i.test(ua)                          // LINE
        || /FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)          // Facebook
        || /Messenger/i.test(ua)                        // Messenger
        || /Instagram/i.test(ua)                        // Instagram
        || /Twitter/i.test(ua)                          // X / Twitter
        || /TikTok|musical_ly|BytedanceWebview/i.test(ua) // TikTok
        || /MicroMessenger/i.test(ua)                   // WeChat
        || /;\s*wv\)/i.test(ua);                        // Android WebView ทั่วไป
  }

  async function checkPassword() {
    // ── กรณีอยู่ใน in-app browser: Google ไม่อนุญาตให้ล็อกอิน ────────
    if (isInAppBrowser()) {
      closePasswordModal();
      showExternalBrowserGuide();
      return;
    }

    // ── ใช้ popup ทั้งมือถือและคอมพิวเตอร์ ────────────────────────────
    // signInWithRedirect ใช้ไม่ได้แล้วกับเว็บที่อยู่คนละโดเมนกับ authDomain
    // (ระบบนี้อยู่บน GitHub Pages ส่วน authDomain เป็น firebaseapp.com)
    // เพราะ Safari 16.1+ / Chrome 115+ / Firefox 109+ บล็อก third-party storage
    // Firebase แนะนำให้ใช้ popup แทน — ต้องเรียกทันทีหลังผู้ใช้กดปุ่ม
    try {
      const result = await auth.signInWithPopup(googleProvider);
      await handleAdminLoginResult(result.user);
      return;

    } catch(e) {
      // ผู้ใช้ปิดหน้าต่างเอง — ไม่ต้องแจ้งอะไร
      if (e.code === 'auth/popup-closed-by-user'
       || e.code === 'auth/cancelled-popup-request'
       || e.code === 'auth/user-cancelled') return;

      // เบราว์เซอร์บล็อก popup — ลองวิธี redirect เป็นทางสำรอง
      if (e.code === 'auth/popup-blocked'
       || e.code === 'auth/operation-not-supported-in-this-environment'
       || e.code === 'auth/web-storage-unsupported') {
        console.warn('popup ถูกบล็อก → ลอง redirect', e.code);
        try {
          sessionStorage.setItem('pendingAdminLogin', '1');
          await auth.signInWithRedirect(googleProvider);
          return;
        } catch(e2) {
          console.error('redirect ก็ไม่สำเร็จ:', e2);
        }
        alert('❌ เบราว์เซอร์บล็อกหน้าต่างเข้าสู่ระบบ\n\n'
            + 'กรุณาอนุญาต pop-up ให้เว็บไซต์นี้ แล้วลองใหม่อีกครั้ง\n'
            + 'หรือเปิดด้วย Chrome / Safari โดยตรง');
        return;
      }

      console.error('Login error:', e);
      alert('เกิดข้อผิดพลาดในการเข้าสู่ระบบ:\n' + (e.message || e.code));
    }
  }
