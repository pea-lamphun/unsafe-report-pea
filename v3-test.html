  // รายชื่อทุกหน่วยงาน (ชื่อเซ็นเซอร์นามสกุลแล้ว)
  function rpOptions() {
    const out = [];
    Object.entries(emp.lookup || {}).forEach(([oid, m]) => {
      Object.entries(m || {}).forEach(([key, x]) => {
        if (!x || !(x.name || x.empId)) return;
        out.push({ key, oid, empId: String(x.empId || '').trim(), name: String(x.name || ''), position: x.position || '', department: x.department || '' });
      });
    });
    return out;
  }
  // ลำดับผลค้นหาแบบ Safety Talk: รหัสตรงทุกตัว → รหัสขึ้นต้น → มีเลขในรหัส → ชื่อขึ้นต้น → มีคำในชื่อ
  function rpMatches(q) {
    q = String(q || '').trim().toLowerCase();
    if (q.length < RP_MIN) return [];
    const qd = q.replace(/\D/g, '');
    const hits = [];
    rpOptions().forEach(o => {
      const idl = o.empId.toLowerCase(), idd = o.empId.replace(/\D/g, '');
      const nm = o.name.toLowerCase(), nms = stripPrefix(o.name).toLowerCase();
      let s = -1;
      if (idl && idl === q) s = 0;
      else if (idl && idl.indexOf(q) === 0) s = 1;
      else if (idl && (idl.indexOf(q) >= 0 || (qd.length >= RP_MIN && idd.indexOf(qd) >= 0))) s = 2;
      else if (nms.indexOf(q) === 0) s = 3;
      else if (nm.indexOf(q) >= 0) s = 4;
      if (s >= 0) hits.push({ o, s });
    });
    hits.sort((a, b) => a.s - b.s || (a.s <= 2 ? a.o.empId.localeCompare(b.o.empId) : a.o.name.localeCompare(b.o.name, 'th')));
    return hits.slice(0, 30).map(h => h.o);
  }

  function rpOnInput(v) {
    const list = document.getElementById('rpList');
    if (!list) return;
    const q = String(v || '').trim();
    if (!q) { list.style.display = 'none'; rp.list = []; return; }
    if (q.length < RP_MIN) {
      rp.list = [];
      list.innerHTML = '<div class="ur-ta-empty">พิมพ์อย่างน้อย ' + RP_MIN + ' ตัว เพื่อค้นหา</div>';
      list.style.display = 'block';
      return;
    }
    if (emp.lookupStatus !== 'ok') {
      rp.list = [];
      list.innerHTML = '<div class="ur-ta-empty">' + (emp.lookupStatus === 'loading' ? 'กำลังโหลดรายชื่อ…' : 'ระบบค้นหารายชื่อยังไม่พร้อม') +
        '<div style="margin-top:8px"><button type="button" class="ur-btn sm" onmousedown="event.preventDefault()" onclick="rpSetMode(\'manual\',' + ja(q) + ')">' + ic('plus', 14) + ' กรอกข้อมูลเอง</button></div></div>';
      list.style.display = 'block';
      return;
    }
    rp.list = rpMatches(q);
    rp.hi = 0;
    if (!rp.list.length) {
      list.innerHTML = '<div class="ur-ta-empty">ไม่พบรหัส/ชื่อนี้' +
        '<div style="margin-top:8px"><button type="button" class="ur-btn sm" onmousedown="event.preventDefault()" onclick="rpSetMode(\'manual\',' + ja(q) + ')">' + ic('plus', 14) + ' กรอกข้อมูลเอง</button></div></div>';
    } else {
      list.innerHTML = rp.list.map((o, i) =>
        '<div class="ur-ta-item' + (i === rp.hi ? ' on' : '') + '" role="option" onmousedown="event.preventDefault()" onclick="rpPick(' + i + ')">' +
          '<span class="ur-ta-id">' + esc(o.empId || '—') + '</span>' +
          '<span style="min-width:0"><div class="ur-ta-n">' + esc(o.name) + '</div>' +
          '<div class="ur-ta-s">' + esc([o.position, (OFC[o.oid] || '') + (o.department ? ' ' + o.department : '')].filter(Boolean).join(' · ')) + '</div></span></div>'
      ).join('');
    }
    list.style.display = 'block';
  }
  function rpOnKey(e) {
    const list = document.getElementById('rpList');
    if (!list || list.style.display === 'none' || !rp.list.length) {
      if (e.key === 'Enter') e.preventDefault();       // กันกด Enter แล้วฟอร์มถูกส่ง
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); rp.hi = Math.min(rp.hi + 1, rp.list.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); rp.hi = Math.max(rp.hi - 1, 0); }
    else if (e.key === 'Enter') { e.preventDefault(); rpPick(rp.hi); return; }
    else if (e.key === 'Escape') { list.style.display = 'none'; return; }
    else return;
    Array.from(list.querySelectorAll('.ur-ta-item')).forEach((el, i) => el.classList.toggle('on', i === rp.hi));
  }
  function rpPick(i) {
    const o = rp.list[i];
    if (!o) return;
    rp.picked = o;
    rp.list = [];
    rpRender();
  }
  // แตะนอกช่องค้นหา → ปิดรายการ

  // มีข้อมูลค้างในฟอร์มไหม (ใช้เตือนก่อนออกจากหน้า)
  function rpFormDirty() {
    if (state.page !== 'report') return false;
    const v = id => { const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
    if (v('description') || (uploadedImages && uploadedImages.length)) return true;
    if (TYPE_FIELDS[state.reportType] && TYPE_FIELDS[state.reportType].some(f => f.kind !== 'unit' && v('f_' + f.id))) return true;
    if (rp.picked) return true;
    const m = rp.manual || {};
    return !!(m.first || m.last || m.empId);
  }

  // รวบรวมข้อมูลผู้รายงานตอนกดส่ง
  function rpCollect() {
    if (rp.anon) {
      return { ok: true, data: { anonymous: true, reporterSource: 'anonymous', reporterName: 'ไม่ประสงค์ออกนาม', reporterUnit: '-' } };
    }
    if (rp.mode === 'search') {
      if (!rp.picked) {
        return { ok: false, focus: 'rpQ',
          msg: 'กรุณาระบุผู้รายงาน\n\n• พิมพ์รหัสหรือชื่อ แล้วแตะเลือกจากรายการ\n• หรือกด “ไม่พบรายชื่อ? กรอกข้อมูลเอง”\n• หรือเปิด “ไม่ประสงค์ออกนามผู้รายงาน”' };
      }
      const p = rp.picked, sp = splitName(p.name);
      return { ok: true, data: {
        anonymous: false, reporterSource: 'registry', reporterKey: p.key, reporterOfficeId: p.oid, reporterEmpId: p.empId || '',
        reporterName: p.name, reporterTitle: sp.title, reporterPosition: p.position || '',
        reporterOrg: OFC[p.oid] || '', reporterDept: p.department || '',
        reporterUnit: ((OFC[p.oid] || '') + (p.department ? ' ' + p.department : '')).trim()
      } };
    }
    const m = {};
    Object.keys(rp.manual).forEach(k => { m[k] = String(rp.manual[k] || '').trim(); });
    if (!m.title) return { ok: false, focus: 'rmTitle', msg: 'กรุณาเลือกคำนำหน้า' };
    if (!m.first) return { ok: false, focus: 'rmFirst', msg: 'กรุณากรอกชื่อ' };
    if (!m.last) return { ok: false, focus: 'rmLast', msg: 'กรุณากรอกนามสกุล' };
    if (!m.office) return { ok: false, focus: 'rmOffice', msg: 'กรุณาเลือกหน่วยงาน' };
    if (m.office === 'other' && !m.other) return { ok: false, focus: 'rmOther', msg: 'กรุณาระบุหน่วยงาน' };
    const org = m.office === 'other' ? m.other : (OFC[m.office] || '');
    return { ok: true, data: {
      anonymous: false, reporterSource: 'manual', reporterEmpId: m.empId,
      reporterTitle: m.title, reporterFirstName: m.first, reporterLastName: m.last,
      reporterName: m.title + m.first + ' ' + m.last, reporterPosition: m.position,
      reporterOfficeId: m.office === 'other' ? '' : m.office,
      reporterOrg: org, reporterDept: m.office === 'other' ? '' : m.dept,
      reporterUnit: (org + (m.office !== 'other' && m.dept ? ' ' + m.dept : '')).trim()
    } };
  }
  // กรอกเองแต่รหัสตรงกับคนในระบบ → ถามว่าใช้รายชื่อนั้นแทนไหม
  function rpRegistryHitForManual() {
    const id = String(rp.manual.empId || '').trim();
    if (!id || emp.lookupStatus !== 'ok') return null;
    return rpOptions().find(o => o.empId === id) || null;
  }
  
  let uploadedImages = [];
  
  async function handleImages(event) {
    const files = Array.from(event.target.files).slice(0, 3);
    uploadedImages = [];
    const preview   = document.getElementById('imagePreview');
    const submitBtn = document.getElementById('submitBtn');

    if (files.length === 0) {
      preview.innerHTML = '';
      return;
    }

    // ล็อกปุ่มส่ง — กันกดส่งขณะรูปยังอัปโหลดไม่เสร็จ
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
    }

    const errors = [];
    const providersUsed = [];
    imagesUploading = true;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      preview.innerHTML = '<div class="col-span-3 text-center text-blue-600 py-2">📤 กำลังอัปโหลดรูปที่ ' + (i + 1) + '/' + files.length + '...</div>';

      try {
        const compressed = await compressImage(file, 1200, 0.8);
        const imageUrl   = await uploadImageWithFallback(compressed);

        if (imageUrl) {
          uploadedImages.push(imageUrl);
          if (lastUploadInfo.provider && providersUsed.indexOf(lastUploadInfo.provider) === -1) providersUsed.push(lastUploadInfo.provider);
        } else {
          errors.push('รูปที่ ' + (i + 1) + ': อัปโหลดไม่สำเร็จ' + (lastUploadInfo.errors.length ? ' (' + lastUploadInfo.errors.join(' / ') + ')' : ''));
        }
      } catch (error) {
        console.error('Image processing error:', error);
        errors.push('รูปที่ ' + (i + 1) + ': ' + (error.message || 'เกิดข้อผิดพลาด'));
      }
    }

    // แสดงผลลัพธ์
    preview.innerHTML = '';

    uploadedImages.forEach(function(url, index) {
      const div = document.createElement('div');
      div.className = 'relative';
      const im = document.createElement('img');
      im.src = url;
      im.className = 'w-full h-24 object-cover rounded-lg border-2 border-gray-300';
      const badge = document.createElement('div');
      badge.className = 'absolute top-1 right-1 bg-green-600 text-white rounded-full px-2 py-1 text-xs font-semibold';
      badge.textContent = '✓ ' + (index + 1);
      div.appendChild(im);
      div.appendChild(badge);
      preview.appendChild(div);
    });

    if (uploadedImages.length > 0) {
      const successDiv = document.createElement('div');
      successDiv.className = 'col-span-3 text-center text-green-600 font-semibold mt-2 text-sm';
      successDiv.textContent = '✅ อัปโหลดสำเร็จ ' + uploadedImages.length + ' รูป' + (providersUsed.length ? ' (ผ่าน ' + providersUsed.join(', ') + ')' : '');
      preview.appendChild(successDiv);
    }

    // แจ้ง error ให้ผู้ใช้เห็นชัดเจน
    if (errors.length > 0) {
      const errDiv = document.createElement('div');
      errDiv.className = 'col-span-3 mt-2 p-3 bg-red-50 border border-red-300 rounded-lg text-red-700 text-sm';
      const head = document.createElement('div');
      head.style.fontWeight = '700';
      head.textContent = '⚠️ บางรูปอัปโหลดไม่สำเร็จ';
      errDiv.appendChild(head);
      errors.forEach(function(e) {
        const line = document.createElement('div');
        line.textContent = '• ' + e;
        errDiv.appendChild(line);
      });
      const hint = document.createElement('div');
      hint.style.cssText = 'font-size:12px;margin-top:6px;opacity:.85;';
      hint.textContent = 'วิธีแก้: เลือกรูปจากคลังภาพแทนการถ่ายสด หรือลองใหม่อีกครั้ง';
      errDiv.appendChild(hint);
      preview.appendChild(errDiv);
    }

    imagesUploading = false;
    // ปลดล็อกปุ่มส่ง
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
    }
  }
  
  // ================== ส่งรายงาน ==================
  let isSubmitting = false;
  let imagesUploading = false;

  async function submitReport(event) {
    if (event) event.preventDefault();
    if (isSubmitting) return;
    if (imagesUploading) { alert('⏳ รูปภาพยังอัปโหลดไม่เสร็จ กรุณารอสักครู่'); return; }

    const t = REPORT_TYPES[state.reportType] ? state.reportType : 'UA';
    document.querySelectorAll('.ur-inp.bad').forEach(el => el.classList.remove('bad'));
    const fail = (msg, id) => {
      alert('❌ ' + msg);
      const el = id && document.getElementById(id);
      if (el) {
        if (el.classList.contains('ur-inp')) el.classList.add('bad');
        try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { }
        setTimeout(() => { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }, 250);
      }
    };
    const val = id => { const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };

    // 1) ผู้รายงาน
    if (!rp.anon && rp.mode === 'manual') {
      const hit = rpRegistryHitForManual();
      if (hit && confirm('รหัส ' + hit.empId + ' ตรงกับ “' + hit.name + '” ในระบบ\n\nใช้รายชื่อนี้เป็นผู้รายงานหรือไม่?')) {
        rp.mode = 'search'; rp.picked = hit; rpRender();
      }
    }
    const who = rpCollect();
    if (!who.ok) return fail(who.msg, who.focus);

    // 2) วันที่พบเหตุการณ์
    const incidentDate = val('incidentDate');
    if (!incidentDate) return fail('กรุณาเลือกวันที่พบเหตุการณ์', 'incidentDate');
    if (incidentDate > localDateStr()) return fail('วันที่พบเหตุการณ์ต้องไม่เกินวันนี้', 'incidentDate');

    // 3) รายละเอียด
    const description = val('description');
    if (!description) return fail('กรุณากรอก' + DESC_SPEC[t].label, 'description');

    // 4–5) ช่องเฉพาะของประเภทนี้
    const extra = {};
    for (const f of TYPE_FIELDS[t]) {
      const v = val('f_' + f.id);
      if (!v) return fail((f.kind === 'unit' ? 'กรุณาเลือก' : 'กรุณากรอก') + f.label, 'f_' + f.id);
      extra[f.id] = v;
    }
    if (t === 'RP') {
      const uid = parseInt(extra.respUnitId, 10) || 0;
      const u = RESPONSIBLE_UNITS.find(x => x.id === uid);
      extra.respUnitId = u ? uid : 0;
      extra.respUnitName = u ? u.name : 'ไม่ทราบ (ให้ จป.วิชาชีพ พิจารณา)';
    }

    if (uploadedImages.length === 0 && !confirm('ไม่มีรูปภาพ ต้องการส่งรายงานต่อหรือไม่?')) return;

    const report = cleanObj(Object.assign({
      // เติมอักขระสุ่มท้าย id กันชนกันเมื่อมีคนส่งพร้อมกันในมิลลิวินาทีเดียว
      id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
      reportType: t,
      incidentDate: incidentDate,
      description: description,
      images: uploadedImages.slice(0, 3),
      status: 'pending'
    }, who.data, extra));

    const btn = document.getElementById('submitBtn');
    isSubmitting = true;
    if (btn) { btn.disabled = true; btn.dataset.label = btn.innerHTML; btn.innerHTML = '<span class="ur-spin" style="width:18px;height:18px;margin:0;border-width:3px;border-color:rgba(255,255,255,.35);border-top-color:#fff"></span> กำลังบันทึก…'; }
    let ok = false;
    try { ok = await saveReport(report); }
    finally {
      isSubmitting = false;
      const b = document.getElementById('submitBtn');
      if (b && !ok) { b.disabled = false; if (b.dataset.label) b.innerHTML = b.dataset.label; }
    }
  }

  async function saveReport(report) {
    if (!isFirebaseReady) { alert('⚠️ Firebase ยังไม่พร้อม กรุณารอสักครู่'); return false; }
    try {
      const now = new Date();
      const datePrefix = String(now.getFullYear() + 543).slice(-2) + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
      // ใช้เลขสูงสุดของวันนี้ +1 (ไม่ใช้จำนวนใบ เพราะถ้ามีการลบใบงานเลขจะซ้ำ)
      const usedNumbers = new Set(state.reports.map(r => r.reportNumber).filter(Boolean));
      const todayMax = state.reports
        .filter(r => r.reportNumber && String(r.reportNumber).startsWith(datePrefix))
        .map(r => parseInt(String(r.reportNumber).slice(datePrefix.length), 10))
        .filter(n => !isNaN(n))
        .reduce((a, b) => Math.max(a, b), 0);
      let seq = todayMax + 1;
      while (usedNumbers.has(datePrefix + String(seq).padStart(3, '0'))) seq++;

      const saved = Object.assign({}, report, { reportNumber: datePrefix + String(seq).padStart(3, '0'), createdAt: now.toISOString() });
      await database.ref('reports/' + report.id).set(saved);
      console.log('✅ Report saved:', saved.reportNumber, saved.reportType);

      notifyAdminNewReport(saved).then(sent => console.log('📤 Admin notification:', sent ? 'sent' : 'no admin registered'))
                                 .catch(e => console.warn('แจ้ง Admin ไม่สำเร็จ', e));

      const T = REPORT_TYPES[typeOf(saved)];
      alert('✅ ส่ง' + (T.safety ? 'รายงาน ' + T.en : 'เรื่องแจ้งซ่อม/ข้อเสนอแนะ') + ' สำเร็จ\n\nเลขที่: ' + saved.reportNumber +
            (saved.reporterSource === 'manual' ? '\n\nจป.วิชาชีพ จะเพิ่มรายชื่อของท่านเข้าระบบ ครั้งหน้าค้นหาด้วยรหัสได้เลย' : '') +
            '\n\nขอบคุณที่ร่วมดูแลความปลอดภัยครับ');
      navigateTo('home', { force: true });
      return true;
    } catch (e) {
      console.error('❌ Save error:', e);
      alert('❌ บันทึกไม่สำเร็จ: ' + (e && e.message) + '\n\nข้อมูลยังอยู่ในฟอร์ม กรุณาลองส่งใหม่อีกครั้ง');
      return false;
    }
  }

  // อัปเดตเฉพาะช่องที่เปลี่ยน (เดิมเขียนทับทั้งใบ — เสี่ยงทับงานที่คนอื่นเพิ่งบันทึก)
  async function updateReport(reportId, updates) {
    if (!isFirebaseReady) { alert('⚠️ Firebase ยังไม่พร้อม'); return false; }
    try {
      await database.ref('reports/' + reportId).update(cleanObj(Object.assign({}, updates)));
      return true;
    } catch (e) {
      alert('❌ บันทึกไม่สำเร็จ: ' + (e && e.message));
      return false;
    }
  }

  // ================== Admin: มอบหมายงาน ==================
  async function assignWork(reportId) {
    const report = state.reports.find(r => r.id === reportId);
    if (!report) return;
    const t = typeOf(report), did = domId(reportId);
    const sel = document.getElementById('unit-' + did);
    const unitId = sel ? parseInt(sel.value, 10) : NaN;
    const unit = RESPONSIBLE_UNITS.find(u => u.id === unitId);
    const v = id => { const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
    const focus = id => { const el = document.getElementById(id); if (el) { el.classList.add('bad'); el.focus(); } };

    const updates = { description: v('description-' + did) };
    if (!updates.description) { alert('❌ กรุณากรอกรายละเอียด'); focus('description-' + did); return; }
    for (const f of TYPE_FIELDS[t]) {
      if (f.kind === 'unit') continue;
      const x = v('ed-' + f.id + '-' + did);
      if (!x) { alert('❌ กรุณากรอก' + f.label); focus('ed-' + f.id + '-' + did); return; }
      updates[f.id] = x;
    }
    if (!unit) { alert('❌ กรุณาเลือกหน่วยงานที่รับผิดชอบ'); if (sel) sel.focus(); return; }

    const btn = document.getElementById('assignBtn-' + did);
    if (btn) { btn.disabled = true; btn.textContent = 'กำลังบันทึก…'; }
    Object.assign(updates, { status: 'assigned', assignedTo: unit.name, assignedUnitId: unit.id, assignedAt: new Date().toISOString() });
    const ok = await updateReport(reportId, updates);
    if (!ok) { if (btn) { btn.disabled = false; btn.textContent = 'มอบหมาย'; } return; }

    let lineSuccess = false;
    try { lineSuccess = await sendNewReportNotification(Object.assign({}, report, updates), unit.id); } catch (e) { console.warn(e); }
    alert('✅ มอบหมายงานสำเร็จ!\n\nเลขที่: ' + report.reportNumber + '\nประเภท: ' + typeLabel(t) +
          '\n' + subjectRows(Object.assign({}, report, updates)).map(p => p[0] + ': ' + (p[1] || '-')).join('\n') +
          '\nมอบหมายให้: ' + unit.name + '\n\n' + (lineSuccess ? '✅ ส่ง LINE แจ้งเตือนสำเร็จ' : '⚠️ ไม่พบ LINE User ลงทะเบียนหน่วยงานนี้'));
  }

        (o.sub ? '<div class="ur-modal-s">' + o.sub + '</div>' : '') + '</div>' +
        '<button type="button" class="ur-icon-btn" aria-label="ปิด" onclick="closeModal(\'' + o.id + '\')">' + ic('x', 17) + '</button></div>' +

  const REJECT_REASONS = ['ข้อมูลไม่ชัดเจน', 'มีผู้รายงานเรื่องนี้แล้ว', 'ไม่ใช่เรื่องที่อยู่ในขอบเขตของระบบ', 'อื่นๆ'];

  function handleRejectReasonChange() {
    const s = document.querySelector('input[name="rejectReason"]:checked');
    const c = document.getElementById('otherReasonContainer');
    if (!c) return;
    c.style.display = s && s.value === 'อื่นๆ' ? 'block' : 'none';

  async function confirmReject() {
    const s = document.querySelector('input[name="rejectReason"]:checked');
    if (!s) { alert('❌ กรุณาเลือกเหตุผล'); return; }
    let reason = s.value;
    if (reason === 'อื่นๆ') {
      const o = (document.getElementById('otherReasonText').value || '').trim();
      if (!o) { alert('❌ กรุณาระบุเหตุผล'); document.getElementById('otherReasonText').focus(); return; }
      reason = 'อื่นๆ: ' + o;
    }
    const r = state.reports.find(x => x.id === currentRejectReportId);
    if (!r) { closeRejectModal(); return; }
    if (!confirm('ยืนยันไม่รับลงทะเบียนรายงานเลขที่ ' + r.reportNumber + '?\n\nเหตุผล: ' + reason)) return;
    modalBusy('rejectModal', true);
    const ok = await updateReport(r.id, { status: 'rejected', rejectedReason: reason, rejectedAt: new Date().toISOString() });

    const r = state.reports.find(x => x.id === currentReturnReportId);

      resolveImages: null, resolveLetterImages: null, resolveFixImages: null,   // ล้างรูปชุดเดิม
      resolveNote: '',
      returnReason: reason,
      revisionCount: (parseInt(r.revisionCount, 10) || 0) + 1,
      rejectHistory: historyList(r).concat([{ reason: reason, timestamp: new Date().toISOString() }])
    };

  // ดาวน์โหลดรูปภาพ
  async function downloadImage(imageUrl, filename) {
    try {
      // แสดงสถานะกำลังดาวน์โหลด
      const loadingDiv = document.createElement('div');
      loadingDiv.id = 'downloadLoading';
      loadingDiv.className = 'fixed inset-0 z-[300] bg-black bg-opacity-50 flex items-center justify-center';
      loadingDiv.innerHTML = '<div class="bg-white p-6 rounded-lg text-center"><p class="font-semibold">กำลังดาวน์โหลด...</p></div>';
      document.body.appendChild(loadingDiv);
      
      // Fetch รูปภาพ
      const response = await fetch(imageUrl);
      const blob = await response.blob();
      
      // สร้าง URL สำหรับ download
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename + '.jpg';
      document.body.appendChild(a);
      a.click();
      
      // Cleanup
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
      
      // ลบ loading
      document.getElementById('downloadLoading')?.remove();
      
    } catch (error) {
      console.error('Download error:', error);
      document.getElementById('downloadLoading')?.remove();
      
      // ถ้า fetch ไม่ได้ ให้เปิดในแท็บใหม่แทน
      alert('ไม่สามารถดาวน์โหลดโดยตรงได้\nกรุณากดค้างที่รูป แล้วเลือก "บันทึกรูปภาพ"');
      window.open(imageUrl, '_blank');
    }
  }

  function drawLuckyWheel() {
    const canvas = document.getElementById('luckyWheelCanvas');
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = Math.min(centerX, centerY) - 20;
    
    const segments = [];
    dashboardState.luckyDrawData.forEach(person => {
      for (let i = 0; i < person.count; i++) {
        segments.push({
          name: person.name,
          unit: person.unit,
          personId: person.id || person.name
        });
      }
    });
    
    if (segments.length === 0) return;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate((dashboardState.luckyDrawRotation * Math.PI) / 180);
    
    const anglePerSegment = (2 * Math.PI) / segments.length;
    const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', 
                    '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52B788'];
    
    segments.forEach((segment, index) => {
      const startAngle = index * anglePerSegment;
      const endAngle = startAngle + anglePerSegment;
      const color = colors[index % colors.length];
      
      const gradient = ctx.createRadialGradient(0, 0, 50, 0, 0, radius);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, adjustBrightness(color, -20));
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = '#FFF';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.save();
      ctx.rotate(startAngle + anglePerSegment / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFF';
      ctx.shadowColor = 'rgba(0,0,0,0.7)';
      ctx.shadowBlur = 4;
      ctx.font = 'bold 12px Arial';
      ctx.fillText(segment.name, radius - 10, 0);
      ctx.restore();
    });
    
    ctx.restore();
    
    ctx.beginPath();
    ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
    ctx.fillStyle = '#34495E';
    ctx.fill();
    ctx.strokeStyle = '#ECF0F1';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    const arrowX = centerX + radius;
    const arrowY = centerY;
    
    ctx.beginPath();
    ctx.moveTo(arrowX - 15, arrowY);
    ctx.lineTo(arrowX + 50, arrowY - 40);
    ctx.lineTo(arrowX + 50, arrowY + 40);
    ctx.closePath();
    ctx.fillStyle = '#E74C3C';
    ctx.fill();
    ctx.strokeStyle = '#8B0000';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  
  function adjustBrightness(color, amount) {
    const hex = color.replace('#', '');
    const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + amount));
    const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + amount));
    const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + amount));
    return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
  }
  
  function spinLuckyWheel() {
    if (dashboardState.luckyDrawSpinning) return;
    
    const segments = [];
    dashboardState.luckyDrawData.forEach(person => {
      for (let i = 0; i < person.count; i++) {
        segments.push({
          name: person.name,
          unit: person.unit,
          personId: person.id || person.name
        });
      }
    });
    
    if (segments.length === 0) {
      alert('❌ ไม่มีผู้เข้าร่วม');
      return;
    }
    
    if (dashboardState.luckyDrawWinners.length >= dashboardState.luckyDrawNumberOfWinners) {
      alert('🎉 ได้ครบจำนวนรางวัลแล้ว!');
      return;
    }
    
    dashboardState.luckyDrawSpinning = true;
    
    const spinDuration = 4000;
    const minSpins = 5;
    const randomSpins = minSpins + Math.random() * 3;
    const extraDegrees = Math.random() * 360;
    const totalRotation = randomSpins * 360 + extraDegrees;
    const startRotation = dashboardState.luckyDrawRotation;
    
    let startTime = null;
    
    const animate = (currentTime) => {
      if (!startTime) startTime = currentTime;
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / spinDuration, 1);
      
      const easeOut = 1 - Math.pow(1 - progress, 3);
      const currentRotation = startRotation + (totalRotation * easeOut);
      
      dashboardState.luckyDrawRotation = currentRotation;
      drawLuckyWheel();
      
      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        const finalRotation = currentRotation % 360;
        const segmentAngle = 360 / segments.length;
        const adjustedRotation = (360 - finalRotation) % 360;
        const winnerIndex = Math.floor(adjustedRotation / segmentAngle) % segments.length;
        
        const winnerSegment = segments[winnerIndex];
        const winner = {
          id: winnerSegment.personId,
          name: winnerSegment.name,
          unit: winnerSegment.unit
        };
        
        dashboardState.luckyDrawWinners.push(winner);
        dashboardState.luckyDrawData = dashboardState.luckyDrawData.filter(p => (p.id || p.name) !== winner.id);
        dashboardState.luckyDrawSpinning = false;
        
        render();
        
        setTimeout(() => {
          alert(`🎉 ยินดีด้วย!\n\n${winner.name}\n${winner.unit}\n\nได้รับรางวัลที่ ${dashboardState.luckyDrawWinners.length}!`);
          setTimeout(() => drawLuckyWheel(), 100);
        }, 500);
      }
    };
    
    requestAnimationFrame(animate);
  }

  // ฟังก์ชันกรองข้อมูลตามวันที่
  function filterReportsByDate(reports, period, startDate = null, endDate = null) {
    const now = new Date();
    
    return reports.filter(report => {
      if (!report.createdAt) return false;
      
      const reportDate = new Date(report.createdAt);
      
      switch(period) {
        case 'today':
          return reportDate.toDateString() === now.toDateString();
          
        case 'week':
          const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          return reportDate >= weekAgo;
          
        case 'month':
          return reportDate.getMonth() === now.getMonth() && 
                 reportDate.getFullYear() === now.getFullYear();
          
        case 'year':
          return reportDate.getFullYear() === now.getFullYear();
          
        case 'custom':
          if (startDate && endDate) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            end.setHours(23, 59, 59);
            return reportDate >= start && reportDate <= end;
          }
          return true;
          
        default:
          return true;
      }
    });
  }

  function isNarrowScreen() {

  // ตัดข้อความยาวให้พอดีแกน Y
  function truncateLabel(text, maxLen) {
    const s = String(text || '');
    return s.length > maxLen ? s.substring(0, maxLen - 1) + '…' : s;
  }

  // ตัวเลือกร่วมของกราฟแท่งแนวนอน (Top 10)
  function horizontalBarOptions(titleText) {
    const narrow    = isNarrowScreen();
    const labelWidth = narrow ? 108 : 150;   // พื้นที่สงวนไว้สำหรับชื่อ
    const maxChars   = narrow ? 15  : 24;    // จำนวนตัวอักษรสูงสุด
    const fontSize   = narrow ? 9   : 11;

    return {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      layout: { padding: { left: 2, right: 12, top: 4, bottom: 4 } },
      plugins: {
        legend: { display: false },
        title: {
          display: true,
          text: titleText,
          font: { size: narrow ? 12 : 14, weight: 'bold', family: 'Sarabun' },
          padding: { bottom: 8 }
        },
        tooltip: {
          titleFont: { family: 'Sarabun', size: 12 },
          bodyFont:  { family: 'Sarabun', size: 12 },
          callbacks: {
            // แสดงชื่อเต็มตอนแตะ/ชี้ (ไม่ถูกตัด)
            title: function(items) {
              if (!items || !items.length) return '';
              return items[0].chart.data.labels[items[0].dataIndex];
            }
          }
        }
      },
      scales: {
        x: {
          beginAtZero: true,
          ticks: {
            precision: 0,
            font: { family: 'Sarabun', size: fontSize }
          },
          grid: { drawBorder: false }
        },
        y: {
          // สงวนความกว้างคงที่ให้ชื่อ — กันแท่งกราฟทับชื่อ
          afterFit: function(scale) {
            scale.width = labelWidth;
          },
          ticks: {
            autoSkip: false,
            crossAlign: 'far',
            padding: 6,

        }
      }
    };
  }

  // ================== INIT (v3.0) ==================
  async function init() {
    console.log('%c📌 VERSION ' + APP_VERSION + ' — รายงาน 4 ประเภท + ทะเบียนรายชื่อ (ถ้าเห็นข้อความนี้ = โค้ดใหม่ทำงานแล้ว)',
      'background:#16a34a;color:#fff;padding:4px 8px;border-radius:4px;font-weight:bold;');
    attachEventListeners();
    try {
      // 0. ลิงก์ตรงจาก Rich Menu / ข้อความ LINE
      const qs = new URLSearchParams(window.location.search);
      const pageParam = qs.get('page');
      const typeParam = String(qs.get('type') || '').toUpperCase();
      if (pageParam === 'report') {
        if (REPORT_TYPES[typeParam]) { state.reportType = typeParam; state.page = 'report'; rpReset(); }
        else state.page = 'choose';                       // ลิงก์เดิม ?page=report → ให้เลือกประเภทก่อน
      } else if (['choose', 'tracking', 'dashboard', 'admin', 'roster', 'summary'].indexOf(pageParam) >= 0) {
        state.page = pageParam;
      }
      const unitParam = parseInt(qs.get('unit'), 10);
      replaceNav();

      // 1. Firebase
      if (typeof firebase === 'undefined') throw new Error('Firebase SDK not loaded');
      firebaseApp = firebase.initializeApp(firebaseConfig);
      database = firebase.database();
      auth = firebase.auth();
      googleProvider = new firebase.auth.GoogleAuthProvider();
      isFirebaseReady = true;
      console.log('✅ Firebase initialized successfully');

      render();                       // แสดงหน้าทันที ข้อมูลจะตามมาจาก realtime listener
      setupRealtimeListeners();

      // 1.4 ผลจากการล็อกอินแบบ redirect (กรณี popup ถูกบล็อก)
      try {
        const rr = await auth.getRedirectResult();
        if (rr && rr.user) { sessionStorage.removeItem('pendingAdminLogin'); await handleAdminLoginResult(rr.user); }
      } catch (e) {
        try { sessionStorage.removeItem('pendingAdminLogin'); } catch (x) { }
        console.error('❌ Redirect login error:', e);
        if (e.code && e.code !== 'auth/no-auth-event') alert('เข้าสู่ระบบไม่สำเร็จ:\n' + (e.message || e.code));
      }

      // 1.5 กู้สถานะ Admin อัตโนมัติ (หลัง refresh / เปิดแท็บใหม่)
      auth.onAuthStateChanged(async user => {
        let ok = false;
        if (user && user.email) {
          try { ok = await isAdminEmail(user.email); }
          catch (e) { console.error('❌ ตรวจสอบสิทธิ์ Admin ไม่สำเร็จ:', e); }
        }
        const was = state.isAdmin;
        if (ok) {
          state.isAdmin = true; state.adminUser = user;
          startAdminListeners();
          if (!was) console.log('✅ กู้สถานะ Admin สำเร็จ:', user.email);
        } else {
          state.isAdmin = false; state.adminUser = null;
          stopAdminListeners();
          if (dashboardState.luckyDrawActive) dashboardState.luckyDrawActive = false;
        }
        const first = !authReady;
        authReady = true;
        if (first || was !== state.isAdmin) safeRender();
        if (state.isAdmin) setTimeout(checkRepairPopup, 600);
      });

      // 2. ลิงก์จากข้อความ LINE ถึงหัวหน้าหน่วยงาน → เปิดหน่วยงานนั้นเลย
      if (state.page === 'tracking' && RESPONSIBLE_UNITS.find(u => u.id === unitParam)) setTimeout(() => selectUnit(unitParam), 350);

      console.log('✅ App initialized successfully!');
    } catch (error) {
      console.error('❌ Initialization error:', error);
      const app = document.getElementById('app');
      if (app && !app.innerHTML.trim()) {
        app.innerHTML = '<div style="padding:24px;font-family:sans-serif;text-align:center;">' +
          '<h2 style="color:#dc2626;">⚠️ เกิดข้อผิดพลาด</h2>' +
          '<p style="color:#374151;margin:12px 0;">' + esc(error.message || 'ไม่ทราบสาเหตุ') + '</p>' +
          '<button onclick="location.reload()" style="padding:10px 20px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-size:15px;">โหลดหน้าใหม่</button></div>';
      }
      alert('⚠️ ไม่สามารถเชื่อมต่อ Firebase ได้\n\nกรุณา:\n1. Refresh หน้าเว็บ (Ctrl+Shift+R)\n2. ตรวจสอบ Internet\n3. ลองเปิดในโหมด Incognito\n\nError: ' + error.message);
    }
  }

  // Start app
  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
